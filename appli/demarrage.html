<!doctype html>
<!-- Ouverte par lanceur.ps1 (icône Excalibur du bureau) dès le double-clic, avant que le serveur réponde :
     l'enfant voit tout de suite que le cartable s'ouvre. Le lanceur en écrit une copie avec le bon port à la place
     de __PORT__. La page interroge le serveur et bascule dessus dès qu'il répond. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excalibur s'ouvre…</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g transform='rotate(-25 50 68)'><path d='M46 28 H54 V72 H46 Z' fill='%23cfd6df' stroke='%23697180' stroke-width='2'/><rect x='34' y='21' width='32' height='8' rx='4' fill='%23d4a017'/><rect x='46' y='10' width='8' height='12' fill='%237a4a1f'/><circle cx='50' cy='9' r='6' fill='%23d4a017'/></g><path d='M10 94 Q12 66 34 61 L66 61 Q88 66 90 94 Z' fill='%238a8f98'/></svg>">
<style>
  :root { --fond: #fff8ec; --texte: #2b2118; --doux: #6f6253; --or: #d4a017; }
  @media (prefers-color-scheme: dark) { :root { --fond: #1d1915; --texte: #f3ece2; --doux: #b3a796; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--fond); color: var(--texte); font: 18px/1.5 system-ui, "Segoe UI", sans-serif;
         display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box; }
  svg { width: 140px; height: 140px; }
  .epee { transform-origin: 50% 68%; animation: tire 1.6s ease-in-out infinite alternate; }
  @keyframes tire { from { transform: rotate(-25deg) translateY(0); } to { transform: rotate(-25deg) translateY(-10px); } }
  @media (prefers-reduced-motion: reduce) { .epee { animation: none; transform: rotate(-25deg); } }
  h1 { font-size: 1.6em; margin: .4em 0 .2em; }
  p { color: var(--doux); margin: .3em 0; max-width: 34em; }
  .aide { display: none; margin-top: 1.2em; padding: 12px 16px; border: 2px solid var(--or); border-radius: 12px; }
  .lent .aide { display: block; }
  code { font-size: .9em; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <g class="epee"><path d="M46 28 H54 V72 H46 Z" fill="#cfd6df" stroke="#697180" stroke-width="2"/><rect x="34" y="21" width="32" height="8" rx="4" fill="#d4a017"/><rect x="46" y="10" width="8" height="12" fill="#7a4a1f"/><circle cx="50" cy="9" r="6" fill="#d4a017"/></g>
    <path d="M10 94 Q12 66 34 61 L66 61 Q88 66 90 94 Z" fill="#8a8f98"/>
  </svg>
  <h1>Le cartable s'ouvre…</h1>
  <p id="sous">Encore quelques secondes.</p>
  <div class="aide" role="alert">
    <p><b>Le cartable met longtemps à s'ouvrir.</b></p>
    <p>Pour voir ce qui se passe, ouvrez le dossier du cartable, puis le dossier <code>appli</code>, et double-cliquez sur <b>Installer Excalibur.bat</b> : sa fenêtre affiche le problème.</p>
  </div>
</main>
<script>
  const adresse = "http://localhost:__PORT__";
  const t0 = Date.now();
  async function essai() {
    // no-cors : la réponse est illisible depuis cette page locale, mais elle arrive seulement si le serveur tourne.
    try { await fetch(adresse + "/api/status", { mode: "no-cors", cache: "no-store" }); location.replace(adresse); return; } catch {}
    const s = (Date.now() - t0) / 1000;
    if (s > 20) document.getElementById("sous").textContent = "Le premier lancement de la journée peut prendre un peu plus de temps.";
    if (s > 90) document.body.classList.add("lent");
    setTimeout(essai, 700);
  }
  essai();
</script>
</body>
</html>
