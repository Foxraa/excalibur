<style>
/* Polices servies par ce PC (licence SIL OFL, récupérées sur Google Fonts) : la page ne contacte aucun site extérieur. */
@font-face{font-family:"Andika";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/andika-400.woff2) format("woff2")}
@font-face{font-family:"Andika";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/andika-700.woff2) format("woff2")}
@font-face{font-family:"Andika";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/andika-400-italic.woff2) format("woff2")}
@font-face{font-family:"Grandstander";font-style:normal;font-weight:600 800;font-display:swap;src:url(fonts/grandstander.woff2) format("woff2")}
/* Design pour un enfant de 10 ans qui découvre l'ordinateur.
   Principes :
   1. Se repérer par la couleur : chaque onglet a sa couleur et son pictogramme, et la page entière
      prend la couleur de l'onglet ouvert (titres, boutons, liserés). « Je suis dans le violet = mes devoirs ».
   2. Ce qui se clique se voit : boutons épais en relief qui s'enfoncent sous le doigt, cibles de 48 px minimum,
      survol qui soulève. Ce qui ne se clique pas reste plat.
   3. Lire sans effort : Andika (police conçue pour les lecteurs débutants) en 18 px, Grandstander pour les titres.
   4. Récompenser visiblement : étoiles dorées, barres de progression vives, confettis, petites animations
      (désactivées si le système demande moins de mouvement).
   Les leçons gardent la fiche Seyès à marge rouge : c'est le repère du vrai cahier. */
:root{
  --bg:#fff8ee; --bg-dot:#ffe3c2; --surface:#ffffff; --surface-2:#f6f3ff; --ink:#22184a; --ink-soft:#5f5888;
  --line:#e6def7; --seyes:#dbe4f6; --seyes-strong:#b4c6ec;
  --marge:#e8414c; --ok:#178a4c; --ok-bg:#dcf7e6; --warn:#a35a00; --warn-bg:#fff0d4;
  --bad:#cf2b37; --bad-bg:#ffe3e5; --star:#f2a900; --star-l:#ffd94a;
  --shadow:0 2px 0 rgba(60,40,140,.06),0 10px 24px -8px rgba(60,40,140,.16);
  --lift:0 4px 0 rgba(60,40,140,.08),0 18px 30px -10px rgba(60,40,140,.25);
  --f-display:"Grandstander","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Andika","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:22px; --r-s:16px;
  /* Couleur de la section ouverte : posée par body[data-sec] plus bas */
  --sec:#6741d9; --sec-l:#b197fc;
  --accent:var(--sec); --accent-ink:#ffffff;
  --tint:color-mix(in srgb,var(--accent) 12%,var(--surface));
  --tint-2:color-mix(in srgb,var(--accent) 22%,var(--surface));
  --press:color-mix(in srgb,var(--accent) 62%,#000);
  --kc-bleu:#2a4fd0;--kc-bleu-bg:#e3eaff;--kc-rouge:#c62f3a;--kc-rouge-bg:#fde4e6;--kc-vert:#1d7f46;--kc-vert-bg:#dcf2e4;
  --kc-orange:#b35a00;--kc-orange-bg:#ffe9d1;--kc-violet:#7a3fc4;--kc-violet-bg:#eee3fc;--kc-jaune:#8a6d00;--kc-jaune-bg:#fff2b8;--kc-gris:#58628c;--kc-gris-bg:#eceff7;
  --vac:#14a3a3; --vac-ink:#0b6b6b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15112b; --bg-dot:#231c45; --surface:#1f1940; --surface-2:#2a2252; --ink:#f1edff; --ink-soft:#b6acdf;
    --line:#3a3168; --seyes:#2a2a55; --seyes-strong:#3d4280;
    --marge:#ff7d85; --ok:#5fe09a; --ok-bg:#163a29; --warn:#ffbf5c; --warn-bg:#3d2c10;
    --bad:#ff8c95; --bad-bg:#45192152; --star:#ffcb40; --star-l:#ffe17a;
    --shadow:0 2px 0 rgba(0,0,0,.25),0 10px 24px -8px rgba(0,0,0,.5);
    --lift:0 4px 0 rgba(0,0,0,.3),0 18px 30px -10px rgba(0,0,0,.6);
    --accent:var(--sec-l); --accent-ink:#150f2e; --press:color-mix(in srgb,var(--sec-l) 55%,#000);
    color-scheme:dark;
    --kc-bleu:#9db3ff;--kc-bleu-bg:#24315f;--kc-rouge:#ff8f97;--kc-rouge-bg:#4a1f27;--kc-vert:#72dca0;--kc-vert-bg:#173a29;
    --kc-orange:#ffb466;--kc-orange-bg:#45300f;--kc-violet:#cba8ff;--kc-violet-bg:#36265a;--kc-jaune:#ffd84d;--kc-jaune-bg:#3d3510;--kc-gris:#b0bade;--kc-gris-bg:#283152;
    --vac:#3cc6c0; --vac-ink:#7fe3de;
  }
}
:root[data-theme="dark"]{
  --bg:#15112b; --bg-dot:#231c45; --surface:#1f1940; --surface-2:#2a2252; --ink:#f1edff; --ink-soft:#b6acdf;
  --line:#3a3168; --seyes:#2a2a55; --seyes-strong:#3d4280;
  --marge:#ff7d85; --ok:#5fe09a; --ok-bg:#163a29; --warn:#ffbf5c; --warn-bg:#3d2c10;
  --bad:#ff8c95; --bad-bg:#45192152; --star:#ffcb40; --star-l:#ffe17a;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 10px 24px -8px rgba(0,0,0,.5);
  --lift:0 4px 0 rgba(0,0,0,.3),0 18px 30px -10px rgba(0,0,0,.6);
  --accent:var(--sec-l); --accent-ink:#150f2e; --press:color-mix(in srgb,var(--sec-l) 55%,#000);
  color-scheme:dark;
  --kc-bleu:#9db3ff;--kc-bleu-bg:#24315f;--kc-rouge:#ff8f97;--kc-rouge-bg:#4a1f27;--kc-vert:#72dca0;--kc-vert-bg:#173a29;
  --kc-orange:#ffb466;--kc-orange-bg:#45300f;--kc-violet:#cba8ff;--kc-violet-bg:#36265a;--kc-jaune:#ffd84d;--kc-jaune-bg:#3d3510;--kc-gris:#b0bade;--kc-gris-bg:#283152;
  --vac:#3cc6c0; --vac-ink:#7fe3de;
}
/* Une couleur par section (foncée : texte blanc lisible ; claire : pour le mode sombre) */
[data-sec="jour"]{--sec:#d9480f;--sec-l:#ffa66b}
[data-sec="matieres"]{--sec:#2f5bd8;--sec-l:#8fb0ff}
[data-sec="ajouter"]{--sec:#c2255c;--sec-l:#ff8fbf}
[data-sec="programme"]{--sec:#2b8a3e;--sec-l:#7fe39a}
[data-sec="annee"]{--sec:#0b7285;--sec-l:#66d9e8}
[data-sec="devoirs"]{--sec:#6741d9;--sec-l:#b197fc}
[data-sec="notes"]{--sec:#c92a2a;--sec-l:#ff9a9a}
[data-sec="recompenses"]{--sec:#a85b00;--sec-l:#ffd166}
/* Mode vacances : l'onglet du jour devient « Mes vacances », couleur mer, fond ciel */
html[data-vac] [data-sec="jour"],html[data-vac][data-sec="jour"]{--sec:#0b6fa8;--sec-l:#6cc7f5}
html[data-vac] body{--bg:#eef9ff;--bg-dot:#cdeefc}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-vac] body{--bg:#0e1b2b;--bg-dot:#18324a}}
:root[data-theme="dark"][data-vac] body{--bg:#0e1b2b;--bg-dot:#18324a}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.55;
  background-image:radial-gradient(var(--bg-dot) 1.6px,transparent 1.8px);background-size:26px 26px;background-attachment:fixed}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.6rem;color:var(--accent)} h3{font-size:1.2rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--star);outline-offset:3px;border-radius:12px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:no-preference){
  main .wrap > *{animation:pop-in .35s cubic-bezier(.2,.9,.3,1.2) both}
  main .wrap > *:nth-child(2){animation-delay:.04s} main .wrap > *:nth-child(3){animation-delay:.08s}
  main .wrap > *:nth-child(4){animation-delay:.12s} main .wrap > *:nth-child(n+5){animation-delay:.16s}
}
@keyframes pop-in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* En-tête */
.top{background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:10;box-shadow:0 6px 20px -12px rgba(60,40,140,.35)}
.top::after{content:"";display:block;height:6px;background:linear-gradient(90deg,#d9480f 0 25%,#2f5bd8 0 50%,#6741d9 0 75%,#f2a900 0)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:1.5rem;color:var(--ink)}
.brand h1 .nom{color:var(--accent)}
.brand small{display:block;font-family:var(--f-body);font-size:.85rem;color:var(--ink-soft);font-weight:400}
@media (max-width:560px){.brand small{display:none}.brand h1{font-size:1.2rem;white-space:nowrap}.brand svg{width:40px;height:40px}.wallet{width:100%}.wallet .pill.niv{flex:1;min-width:0}.wallet .pill.niv .nom{display:none}.wallet .mini-bar{flex:1;width:auto}}
.mini-bar{display:block;width:90px;height:10px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);overflow:hidden}
.mini-bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ffd43b,#ff922b);transition:width .4s}
.wallet{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--surface-2);border:2px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.or{background:linear-gradient(180deg,#fff6c9,#ffe27a);border-color:#f2c200;color:#5c3d00;font-size:1.1rem}
.pill.or svg{width:22px;height:22px}
.pill .st{color:var(--star)}

/* Onglets : une rangée de grosses tuiles colorées, pictogramme + mot */
nav.tabs{overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
/* Quatre tuiles seulement, toujours visibles d'un coup, même sur téléphone. */
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-block:6px 12px}
.tab{--c:var(--sec);flex:1 0 auto;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid color-mix(in srgb,var(--c) 30%,transparent);
  background:color-mix(in srgb,var(--c) 9%,var(--surface));padding:8px 10px 7px;border-radius:18px;cursor:pointer;color:var(--ink);font-weight:700;font-size:.9rem;line-height:1.15;text-align:center;
  box-shadow:0 3px 0 color-mix(in srgb,var(--c) 30%,transparent);transition:transform .12s,box-shadow .12s,background .12s}
.tab{height:100%;justify-content:center}
.tab .ico{font-size:1.55rem;line-height:1;display:block;transition:transform .2s}
.tab:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.tab:hover .ico{transform:scale(1.15) rotate(-6deg)}
.tab:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 30%,transparent)}
.tab[aria-current="page"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 60%,#000)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab{--c:var(--sec-l)} :root:not([data-theme="light"]) .tab[aria-current="page"]{color:#150f2e}}
:root[data-theme="dark"] .tab{--c:var(--sec-l)} :root[data-theme="dark"] .tab[aria-current="page"]{color:#150f2e}
@media (max-width:640px){nav.tabs .wrap{gap:6px}.tab{font-size:.8rem;padding:6px 4px}.tab .ico{font-size:1.35rem}}
main{padding-block:24px 110px}
/* Sa semaine (espace parents) */
.sem-jours{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sem-jours span{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:12px;background:var(--surface-2);border:2px solid var(--line);font-size:1.1rem;color:var(--ink-soft)}
.sem-jours span b{font-size:.75rem;text-transform:capitalize}
.sem-jours span.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.sem-chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sem-chiffres > div{display:flex;flex-direction:column;padding:10px 12px;border-radius:var(--r-s);background:var(--tint)}
.sem-chiffres b{font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.sem-chiffres span{font-size:.85rem;color:var(--ink-soft)}
/* Les 3 règles des étoiles */
.regles{display:grid;gap:10px}
.regle{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:var(--r-s);background:var(--tint);font-size:1.05rem}
.regle b{flex:none;min-width:56px;text-align:center;font-family:var(--f-display);font-size:1.6rem;color:var(--star)}
/* Sous-onglets d'une section (Apprendre : leçons / année ; Mon trésor : étoiles / notes / parents) */
.sous{margin-bottom:-6px}
/* Accueil : une seule mission, en grand */
.mission-jour{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 20px;border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:linear-gradient(180deg,var(--tint),var(--surface) 70%)}
.mission-jour h2{font-size:1.7rem;max-width:30ch}
.mission-jour .mj-ico{font-size:3rem;line-height:1}
.mission-jour .mj-btns{justify-content:center}
/* Bouton flottant : ajouter une photo du cahier depuis n'importe quel écran */
#fab{position:fixed;top:auto;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;border-radius:999px;
  --accent:#c2255c;--press:#8a1a42;--accent-ink:#fff;box-shadow:0 4px 0 var(--press),0 12px 24px -8px rgba(0,0,0,.4)}
#fab[hidden]{display:none}
/* Accueil d'un cartable neuf : ni onglets ni bouton photo tant qu'il n'est pas terminé */
[data-accueil] .tabs,[data-accueil] #fab{display:none}
.accueil{max-width:640px;margin:0 auto}
.accueil .regles{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.accueil .regles li{display:flex;gap:10px;align-items:baseline}
.accueil .regles b{flex:none;min-width:2.2em;color:var(--accent)}
@media (max-width:560px){#fab{padding:12px 18px;min-height:56px;font-size:1rem}}
main .wrap{display:flex;flex-direction:column;gap:22px}
main .wrap > h2,main .wrap > .sec-title h2{font-size:1.9rem}

/* Blocs */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card > h2,.card > h3{margin-bottom:12px}
.card h3{color:var(--ink)}
.card > h3::before,.card .sec-title > h3::before{content:"";display:inline-block;width:10px;height:22px;border-radius:6px;background:var(--accent);margin-right:10px;vertical-align:-3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cols{display:grid;gap:22px;grid-template-columns:1fr 1fr}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.muted{color:var(--ink-soft)}
.small{font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:10px}
.sec-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.eyebrow{font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--accent)}

/* Boutons : en relief, ils s'enfoncent quand on clique */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:2px solid var(--line);background:var(--surface);padding:9px 18px;border-radius:14px;cursor:pointer;font-weight:700;text-decoration:none;
  box-shadow:0 3px 0 var(--line);transition:transform .1s,box-shadow .1s,border-color .1s,background .1s;position:relative;top:0}
.btn:hover{border-color:var(--accent);background:var(--tint)}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--press)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#fff);border-color:var(--accent)}
.btn.primary:active:not([disabled]){box-shadow:0 0 0 var(--press);transform:translateY(4px)}
.btn.big{min-height:60px;padding:14px 26px;font-size:1.15rem;border-radius:20px;font-family:var(--f-display)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:10px;box-shadow:none;min-height:40px}
.btn.ghost:hover{background:var(--tint)}
.btn.small{min-height:38px;padding:6px 12px;font-size:.88rem}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);background:var(--bad-bg)}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.fait{opacity:.55;filter:grayscale(1)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 13px;font-weight:400;width:100%;min-width:0;min-height:48px;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--tint-2);outline:none}
textarea{min-height:90px;resize:vertical}
.form-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end}

/* Matières */
.mchip{display:inline-flex;align-items:center;gap:6px;padding:2px 11px;border-radius:999px;font-size:.84rem;font-weight:700;background:color-mix(in srgb,var(--m) 16%,var(--surface));color:var(--ink);border:2px solid color-mix(in srgb,var(--m) 45%,transparent)}
.mchip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--m)}
.mcard{position:relative;overflow:hidden;border:2px solid color-mix(in srgb,var(--m) 35%,var(--line));cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;font:inherit;color:inherit;padding-top:74px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--m) 22%,var(--surface)) 0 58px,var(--surface) 58px);transition:transform .15s,box-shadow .15s}
.mcard::before{content:attr(data-ico);position:absolute;left:16px;top:10px;width:56px;height:56px;display:grid;place-items:center;font-size:1.9rem;background:var(--surface);border-radius:18px;border:3px solid var(--m);box-shadow:0 3px 0 color-mix(in srgb,var(--m) 50%,transparent)}
.mcard h3{color:var(--ink);margin-top:4px}
.mcard > h3::before{background:var(--m)}
.mcard:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:var(--lift);border-color:var(--m)}
.mcard:active{transform:translateY(0)}
.mcard .k{display:flex;gap:14px;font-variant-numeric:tabular-nums}
.mhead{border-top:12px solid var(--m)}

/* Liste d'éléments */
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r-s);background:var(--surface);min-width:0;transition:border-color .12s,transform .12s,background .12s}
.card .item{background:var(--surface-2);border-color:transparent}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item.clickable{cursor:pointer}
.item.clickable:hover{border-color:var(--accent);transform:translateX(3px);background:var(--tint)}
.item.late{border-color:var(--bad);background:var(--bad-bg)}
.item.done{background:var(--ok-bg)}
.item.done .t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-soft)}
label.item{cursor:pointer}
/* Case à cocher dessinée : grosse, ronde, verte quand c'est fait */
input[type=checkbox].chk{appearance:none;-webkit-appearance:none;width:34px;height:34px;flex:none;margin:0;cursor:pointer;border-radius:11px;border:3px solid var(--seyes-strong);background:var(--surface);display:grid;place-items:center;transition:background .15s,border-color .15s,transform .15s}
input[type=checkbox].chk:hover{border-color:var(--ok)}
input[type=checkbox].chk::after{content:"";width:9px;height:16px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg) scale(0);margin-top:-4px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
input[type=checkbox].chk:checked{background:var(--ok);border-color:var(--ok)}
input[type=checkbox].chk:checked::after{transform:rotate(45deg) scale(1)}
@media (prefers-reduced-motion:no-preference){input[type=checkbox].chk:checked{animation:boing .35s}}
@keyframes boing{40%{transform:scale(1.25)}100%{transform:scale(1)}}
.empty{padding:20px;border:3px dashed var(--line);border-radius:var(--r-s);color:var(--ink-soft);text-align:center;background:color-mix(in srgb,var(--surface-2) 50%,transparent)}
.empty::before{content:"🌱";display:block;font-size:1.8rem;margin-bottom:4px}

/* Fiche Seyès */
.fiche{position:relative;background-color:var(--surface);border:2px solid var(--line);border-radius:8px 8px var(--r) var(--r);padding:24px 22px 28px 72px;box-shadow:var(--shadow);
  background-image:
    linear-gradient(to right,transparent 0 50px,var(--marge) 50px 52px,transparent 52px),
    repeating-linear-gradient(to bottom,transparent 0 31px,var(--seyes-strong) 31px 32px),
    repeating-linear-gradient(to bottom,transparent 0 7px,var(--seyes) 7px 8px);
  background-position:0 0,0 14px,0 14px;}
.fiche::before{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-2deg);width:110px;height:24px;background:color-mix(in srgb,var(--star-l) 70%,transparent);border-radius:3px;opacity:.85}
@media (max-width:560px){.fiche{padding-left:34px;background-image:linear-gradient(to right,transparent 0 18px,var(--marge) 18px 20px,transparent 20px),repeating-linear-gradient(to bottom,transparent 0 31px,var(--seyes-strong) 31px 32px),repeating-linear-gradient(to bottom,transparent 0 7px,var(--seyes) 7px 8px)}}
.fiche > *{position:relative}
.fiche .stack{gap:14px}
.fiche h2{color:var(--accent);font-size:1.7rem}
.fiche h3{color:var(--marge);margin-top:6px}
.fiche .ex{background:color-mix(in srgb,var(--surface) 85%,transparent);border-left:5px solid var(--accent);padding:8px 12px;border-radius:0 12px 12px 0}
.retenir{border:3px solid var(--marge);border-radius:16px;padding:12px 16px;background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:4px 4px 0 color-mix(in srgb,var(--marge) 25%,transparent)}
.retenir h3{margin:0 0 6px}
.retenir h3::before{content:"⭐ "}
.retenir ul,.fiche ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.note-box{border-radius:14px;padding:12px 16px;background:var(--warn-bg);color:var(--ink);border:2px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.note-box strong{color:var(--warn)}
dl.mots{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
dl.mots dt{font-weight:700;color:var(--accent)}
dl.mots dd{margin:0}
@media (max-width:500px){dl.mots{grid-template-columns:1fr}dl.mots dd{margin-bottom:6px}}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs img{width:110px;height:110px;object-fit:cover;border-radius:14px;border:3px solid var(--surface);box-shadow:var(--shadow);transform:rotate(-1.5deg)}
.thumbs img:nth-child(even){transform:rotate(1.5deg)}
details summary{cursor:pointer;font-weight:700;color:var(--accent);min-height:40px;display:flex;align-items:center;gap:6px}

/* Aujourd'hui */
.hello{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;position:relative;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface) 60%);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.hello::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:color-mix(in srgb,var(--star-l) 35%,transparent);z-index:0;pointer-events:none}
.hello > *{position:relative;z-index:1}
.hello:not(:has(.mascotte)){grid-template-columns:1fr auto}
@media (max-width:760px){.hello,.hello:not(:has(.mascotte)){grid-template-columns:1fr}.hello .mascotte{display:none}}
.hello h2{font-size:2.2rem;color:var(--ink)}
.hello h2 .nom{color:var(--accent)}
.mascotte{width:110px;height:110px}
@media (prefers-reduced-motion:no-preference){
  .mascotte{animation:flotte 3.5s ease-in-out infinite}
  .mascotte .oeil{animation:cligne 5s infinite;transform-origin:center;transform-box:fill-box}
}
@keyframes flotte{50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes cligne{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.nudge{font-size:1.15rem;margin-top:8px;background:var(--surface);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 14px;display:inline-block;max-width:52ch}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* Mes vacances */
.vac-hero{background:linear-gradient(180deg,#bfe9ff 0%,#e9f8ff 58%,#ffe9b8 58%,#fff4d6 100%);border-color:#9fd8f5;color:#12324a}
.vac-hero::after{right:24px;top:18px;width:74px;height:74px;background:radial-gradient(circle,#ffd43b 55%,#ffe98a 56%,transparent 72%);opacity:1}
.vac-hero h2,.vac-hero .eyebrow{color:#0b4f7a}.vac-hero h2 .nom{color:#0b6fa8}
.vac-hero .nudge{background:#ffffffd9;border-color:#9fd8f5;color:#12324a}
.vac-hero .stat{background:#ffffffcc}.vac-hero .muted{color:#3d6680}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vac-hero{background:linear-gradient(180deg,#123d5c 0%,#16324a 58%,#3a3018 58%,#2c2614 100%);border-color:#24557a;color:#e6f4ff}
  :root:not([data-theme="light"]) .vac-hero h2,:root:not([data-theme="light"]) .vac-hero .eyebrow{color:#9fdcff}:root:not([data-theme="light"]) .vac-hero h2 .nom{color:#6cc7f5}
  :root:not([data-theme="light"]) .vac-hero .nudge,:root:not([data-theme="light"]) .vac-hero .stat{background:#0e1b2bcc;border-color:#24557a;color:#e6f4ff}:root:not([data-theme="light"]) .vac-hero .muted{color:#a9c8dd}}
:root[data-theme="dark"] .vac-hero{background:linear-gradient(180deg,#123d5c 0%,#16324a 58%,#3a3018 58%,#2c2614 100%);border-color:#24557a;color:#e6f4ff}
:root[data-theme="dark"] .vac-hero h2,:root[data-theme="dark"] .vac-hero .eyebrow{color:#9fdcff}:root[data-theme="dark"] .vac-hero h2 .nom{color:#6cc7f5}
:root[data-theme="dark"] .vac-hero .nudge,:root[data-theme="dark"] .vac-hero .stat{background:#0e1b2bcc;border-color:#24557a;color:#e6f4ff}:root[data-theme="dark"] .vac-hero .muted{color:#a9c8dd}
.vac-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.vac-cal .jn{font-size:.75rem;text-align:center;color:var(--ink-soft);font-weight:700}
.vday{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:58px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;line-height:1.1;padding:4px 2px;cursor:pointer;font-size:.95rem}
.vday .e{font-size:1.25rem}
.vday.repos{background:transparent;border-style:dashed;cursor:default;color:var(--ink-soft)}
.vday.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.vday.rate{border-color:var(--warn)}
.vday.auj{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.vday[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vday.vide{visibility:hidden}
.mission .item .num{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;background:var(--tint-2)}
.mission .item.done .num{background:var(--ok-bg)}
@media (max-width:560px){.mission .item{flex-wrap:wrap}.mission .item .grow{flex-basis:calc(100% - 52px)}.mission .item .btn{flex:1}}
.mission .item.done .t{text-decoration:line-through;text-decoration-color:var(--ok);text-decoration-thickness:3px}
.vac-bar{height:16px;border-radius:999px;background:var(--surface-2);border:2px solid var(--line);overflow:hidden}
.vac-bar i{display:block;height:100%;background:linear-gradient(90deg,#4dabf7,#20c997);border-radius:999px}
/* Défis éclair (sans Claude) */
.defi .big-q{font-family:var(--f-display);font-size:2.6rem;text-align:center;font-variant-numeric:tabular-nums}
.defi .phrase{font-size:1.45rem;text-align:center}
.defi .trou{display:inline-block;min-width:3.2em;border-bottom:4px dotted var(--accent);color:var(--accent);font-weight:700}
.defi input.rep{font-size:2rem;text-align:center;width:7ch;font-variant-numeric:tabular-nums}
.defi .chrono{font-variant-numeric:tabular-nums}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 10px;min-width:0;text-align:center}
.stat:nth-child(1){border-color:#f2c200;background:linear-gradient(180deg,#fffbe6,#fff3bf)} .stat:nth-child(1) b{color:#a36b00}
.stat:nth-child(2){border-color:#ff922b;background:linear-gradient(180deg,#fff4e6,#ffe8cc)} .stat:nth-child(2) b{color:#c2410c}
.stat:nth-child(3){border-color:#4dabf7;background:linear-gradient(180deg,#e7f5ff,#d0ebff)} .stat:nth-child(3) b{color:#1864ab}
.stat:nth-child(n) .muted{color:#5f5888}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.bar{height:16px;border-radius:999px;background:var(--surface-2);border:2px solid var(--line);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ffd43b,#ff922b);
  background-image:linear-gradient(90deg,#ffd43b,#ff922b),repeating-linear-gradient(45deg,rgba(255,255,255,.25) 0 8px,transparent 8px 16px);background-blend-mode:overlay}
.tip{background:linear-gradient(135deg,#fff9db,#fff3bf);color:#3d2e00;border:2px solid #ffe066;border-radius:var(--r);padding:16px 18px 16px 70px;position:relative;box-shadow:var(--shadow)}
.tip::before{content:"💡";position:absolute;left:18px;top:14px;font-size:2rem}
.tip .eyebrow{color:#a36b00}

/* Quiz */
.quiz{max-width:760px;width:100%;margin:0 auto}
.dots{display:flex;gap:7px;flex-wrap:wrap}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}
.dots i.ok{background:var(--ok)} .dots i.ko{background:var(--bad)} .dots i.cur{outline:4px solid var(--accent);outline-offset:2px;transform:scale(1.15)}
.qtext{font-size:1.45rem;font-weight:700;line-height:1.4;font-family:var(--f-display)}
.choices{display:grid;gap:12px;counter-reset:ch}
.choice{counter-increment:ch;display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border:3px solid var(--line);background:var(--surface);border-radius:18px;cursor:pointer;font-size:1.1rem;
  box-shadow:0 4px 0 var(--line);transition:transform .1s,border-color .1s,box-shadow .1s}
.choice::before{content:counter(ch,upper-alpha);flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--tint-2);color:var(--accent)}
.choice:hover:not([disabled]){border-color:var(--accent);transform:translateY(-2px)}
.choice:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.choice.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 50%,transparent)}
.choice.right::before{content:"✓";background:var(--ok);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 40%,transparent)}
.choice.wrong::before{content:"✗";background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.choice.wrong{animation:non .4s}.choice.right{animation:boing .4s}}
@keyframes non{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.choice[disabled]{cursor:default}
.fb{border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-bg);border:3px solid var(--ok)}
.fb.ko{background:var(--bad-bg);border:3px solid var(--bad)}
.fb .h{font-family:var(--f-display);font-size:1.35rem}
.fb.ok .h{color:var(--ok)} .fb.ko .h{color:var(--bad)}
.fb.ok .h::before{content:"🎉 "} .fb.ko .h::before{content:"🤔 "}
.tag-hard{display:inline-flex;gap:4px;align-items:center;font-size:.82rem;font-weight:700;padding:3px 11px;border-radius:999px;background:var(--warn-bg);color:var(--warn);border:2px solid color-mix(in srgb,var(--warn) 40%,transparent)}
/* Brouillon du quiz : une feuille Seyès à part, jamais corrigée. */
.brouillon-card{border-style:dashed}
.brouillon-card h3{margin:0}
textarea.brouillon{min-height:200px;line-height:32px;padding:6px 14px 6px 40px;border-radius:10px;background-color:var(--surface);background-attachment:local;
  background-image:linear-gradient(to right,transparent 0 26px,var(--marge) 26px 28px,transparent 28px),
    repeating-linear-gradient(to bottom,transparent 0 27px,var(--seyes-strong) 27px 28px,transparent 28px 32px),
    repeating-linear-gradient(to bottom,transparent 0 3px,var(--seyes) 3px 4px,transparent 4px 8px)}
.answer .brouillon-vu{white-space:pre-wrap;font-size:.9rem;border-left:4px solid var(--seyes-strong);padding-left:10px;margin-top:6px}
.answer{background:var(--surface-2);border-radius:14px;padding:12px 16px;border:2px solid var(--line)}
.score{font-family:var(--f-display);font-size:3.6rem;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}

/* Récompenses */
.badges{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.badge{border:2px solid var(--line);border-radius:18px;padding:14px 12px;text-align:center;background:linear-gradient(180deg,#fff9db,var(--surface));display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.badge:not(.lock):hover{transform:translateY(-3px) rotate(-2deg)}
.badge svg{width:52px;height:52px}
.badge.lock{opacity:.5;filter:grayscale(1);background:var(--surface-2)}
.badge b{font-size:.98rem}
.badge span{font-size:.82rem;color:var(--ink-soft)}
.reward{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border:2px solid var(--line);border-radius:var(--r-s);background:var(--surface-2)}
.reward .t{font-weight:700}
.cost{font-weight:700;color:var(--warn);font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.status{font-size:.82rem;font-weight:700;padding:3px 11px;border-radius:999px}
.status.wait{background:var(--warn-bg);color:var(--warn)} .status.ok{background:var(--ok-bg);color:var(--ok)} .status.no{background:var(--bad-bg);color:var(--bad)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hello::after{opacity:.25}
  :root:not([data-theme="light"]) .badge:not(.lock){background:linear-gradient(180deg,#3d3510,var(--surface))}
  :root:not([data-theme="light"]) .stat,:root:not([data-theme="light"]) .tip{filter:brightness(.9)}}
:root[data-theme="dark"] .hello::after{opacity:.25}
:root[data-theme="dark"] .badge:not(.lock){background:linear-gradient(180deg,#3d3510,var(--surface))}

/* Graphique */
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.chart text{fill:var(--ink-soft);font-size:11px;font-family:var(--f-body)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
table.t td,table.t th{padding:9px 10px;border-bottom:2px dashed var(--line);text-align:left}
table.t tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}

/* Semaine */
.week{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow-x:auto}
.day{border:2px solid var(--line);border-radius:16px;padding:8px;background:var(--surface-2);min-height:96px;display:flex;flex-direction:column;gap:6px}
.day.today{border-color:var(--accent);border-width:3px;background:var(--tint)}
.day h4{margin:0;font-size:.88rem;text-transform:capitalize;color:var(--ink-soft)}
.day.today h4{color:var(--accent)}
.mini{font-size:.84rem;padding:5px 7px;border-radius:9px;background:var(--surface);border-left:5px solid var(--m);overflow-wrap:anywhere}
.mini.done{text-decoration:line-through;color:var(--ink-soft)}

/* Ajouter */
.drop{border:4px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:26px;padding:34px 16px;text-align:center;background:var(--tint);display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;transition:background .15s,transform .15s}
.drop::before{content:"📸";font-size:3rem;line-height:1}
.drop:hover{background:var(--tint-2);transform:scale(1.01)}
.drop.over{border-color:var(--accent);border-style:solid;background:var(--tint-2)}
.thinking{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:var(--r-s);background:var(--tint);border:2px solid var(--tint-2);font-weight:700}
.attente-txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.attente-txt .small{font-weight:400}
/* Le hibou chevalier tranche les mauvaises notes : l'épée frappe toutes les 1,4 s, une note arrive à chaque coup. */
.hibou-attente{width:105px;height:70px;flex:none}
.hibou-attente .epee{transform-box:view-box;transform-origin:76px 68px;transform:rotate(8deg)}
.hibou-attente .mauvaise{opacity:0}
.hibou-attente .n1{opacity:1}
.cases{display:flex;gap:6px}
.case{width:22px;height:14px;border-radius:4px;border:2px solid color-mix(in srgb,var(--accent) 40%,var(--line))}
.case.faite{background:var(--accent);border-color:var(--accent)}
.case.en-cours{border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .hibou-attente .corps{animation:sautille 1.4s ease-in-out infinite}
  .hibou-attente .epee{animation:coup 1.4s ease-in-out infinite}
  .hibou-attente .mauvaise{animation:mauvaise-note 4.2s linear infinite}
  .hibou-attente .n2{animation-delay:1.4s}
  .hibou-attente .n3{animation-delay:2.8s}
  .case.en-cours{animation:clignote 1s ease-in-out infinite}
}
@keyframes sautille{50%{transform:translateY(-3px)}}
@keyframes coup{0%,100%{transform:rotate(8deg)}45%{transform:rotate(-4deg)}66%{transform:rotate(64deg)}}
@keyframes mauvaise-note{0%{transform:translateX(46px);opacity:0}5%{opacity:1}20%{transform:translateX(0);opacity:1}26%{transform:translate(4px,-6px) scale(1.35) rotate(-18deg);opacity:0}100%{transform:translateX(46px);opacity:0}}
@keyframes clignote{50%{background:color-mix(in srgb,var(--accent) 35%,transparent)}}
.offline{background:var(--warn-bg);border:2px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:var(--r-s);padding:12px 16px}

/* Bandeau du haut : l'année scolaire et l'avancement du travail */
.strip{background:var(--surface-2);border-bottom:2px solid var(--line)}
.strip .wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;padding-block:10px 8px}
@media (max-width:720px){.strip .wrap{grid-template-columns:1fr}}
.sb{min-width:0}
.sb-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap;font-size:.88rem;line-height:1.35}
.sb-head b{font-family:var(--f-display);font-size:1rem}
.sb-head .vacn{color:var(--vac-ink);font-weight:700}
.sb-head select{width:auto;padding:1px 6px;border-radius:8px;font-size:.8rem;min-height:0;border-width:1px}
.ytrack{position:relative;height:16px;margin-top:7px;border-radius:999px;background:var(--surface);border:2px solid var(--line)}
.ytrack .past{position:absolute;left:0;top:0;bottom:0;border-radius:999px 0 0 999px;background:linear-gradient(90deg,#b197fc,#748ffc)}
.ytrack .vac{position:absolute;top:0;bottom:0;background:var(--vac)}
.ytrack .fer{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--vac)}
.ytrack .now{position:absolute;top:-7px;bottom:-7px;width:6px;margin-left:-3px;border-radius:3px;background:var(--marge);box-shadow:0 0 0 2px var(--surface-2)}
.months{position:relative;height:15px;margin-top:2px;font-size:.7rem;color:var(--ink-soft)}
.months span{position:absolute;top:0;white-space:nowrap}
.pbar{display:flex;height:16px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--surface);border:2px solid var(--line)}
.pbar i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:4px;font-size:.76rem;color:var(--ink-soft)}
.leg span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.leg span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.leg .late{color:var(--bad);font-weight:700}

/* Toast + confettis */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{background:linear-gradient(135deg,#ffd43b,#ff922b);color:#3d2200;padding:14px 22px;border-radius:20px;font-weight:700;font-size:1.1rem;font-family:var(--f-display);box-shadow:0 6px 0 #d9480f,0 16px 30px -8px rgba(0,0,0,.35);text-align:center;border:3px solid #fff}
@media (prefers-reduced-motion:no-preference){.toast{animation:toast-in .45s cubic-bezier(.2,1.6,.4,1)}}
@keyframes toast-in{from{opacity:0;transform:translateY(30px) scale(.8)}to{opacity:1;transform:none}}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:60;pointer-events:none;border-radius:2px}
@media (prefers-reduced-motion:no-preference){.confetti{animation:fall 1.6s ease-in forwards}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}

/* Programme officiel */
.comp{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:2px dashed var(--line)}
.comp:first-of-type{border-top:0}
.comp .t{flex:1;min-width:0}
.links{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.etat{flex:none;min-width:124px;min-height:38px;justify-content:center;font-size:.82rem;padding:5px 11px;border-radius:999px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--ink-soft)}
.etat.vu{background:color-mix(in srgb,var(--seyes-strong) 22%,transparent);border-color:color-mix(in srgb,var(--seyes-strong) 60%,transparent);color:var(--ink)}
.etat.acquis{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok)}
.etat.acquis::before{content:"✓ "}
.etat.progres{background:color-mix(in srgb,#4dabf7 18%,var(--surface));border-color:#4dabf7;color:var(--ink)}
.etat.fragile{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn)}
.etat-mini{font-size:.76rem;font-weight:700;padding:0 8px;border-radius:999px;border:2px solid var(--line)}
.etat-mini.fragile{color:var(--warn);background:var(--warn-bg)}.etat-mini.progres{color:var(--ink)}.etat-mini.acquis{color:var(--ok);background:var(--ok-bg)}
.lchip{font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:2px solid var(--line);cursor:pointer;color:var(--ink);font-weight:700}
.lchip:hover{border-color:var(--accent);background:var(--tint)}
.matpick{display:flex;flex-wrap:wrap;gap:8px}
.matpick .btn[aria-pressed="true"]{border-color:var(--m);background:color-mix(in srgb,var(--m) 18%,var(--surface));box-shadow:0 3px 0 var(--m)}
@media (max-width:560px){.comp{flex-wrap:wrap}.etat{min-width:0}}
/* Leçons du programme (Markdown du dossier programme_cm1) */
.lchip.ref{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.md{display:flex;flex-direction:column;gap:12px;overflow-wrap:anywhere}
.md h2{font-size:1.35rem;color:var(--marge);margin-top:8px}
.md h3{font-size:1.1rem;color:var(--accent);margin-top:4px}
.md p,.md ul,.md ol,.md pre,.md table,.md blockquote{margin:0}
.md ol{padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
.md blockquote{border-left:5px solid var(--accent);padding:10px 14px;border-radius:0 14px 14px 0;background:color-mix(in srgb,var(--surface) 88%,transparent);display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.md pre{font-family:ui-monospace,Consolas,monospace;font-size:.85rem;line-height:1.3;background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;overflow-x:auto}
.md code{font-family:ui-monospace,Consolas,monospace;font-size:.9em}
.md .tbl{overflow-x:auto;max-width:100%}
.md table{border-collapse:collapse;font-size:.92rem;background:var(--surface)}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--tint)}
.md a{color:var(--accent);font-weight:700}
.md hr{border:0;border-top:2px dashed var(--line);width:100%}
.md details.corrige{border:3px dashed var(--line);border-radius:16px;padding:10px 14px;background:color-mix(in srgb,var(--surface) 92%,transparent)}
.md details.corrige[open]{display:flex;flex-direction:column;gap:10px}
/* Schémas des leçons (appli/schemas.mjs) */
.sch{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 10px}
.sch-scroll{width:100%;max-width:100%;overflow-x:auto}
/* Centré par les marges (et pas par flex) : sur un petit écran, le défilement commence bien au bord gauche. */
.sch-scroll>svg{display:block;margin:0 auto;max-width:100%;height:auto;color:var(--ink);font-family:var(--f-body);overflow:visible}
.sch figcaption{font-size:.9rem;color:var(--ink-soft);text-align:center;max-width:62ch}
.sch text{fill:currentColor}
.sch .k-bleu{--k:var(--kc-bleu);--kb:var(--kc-bleu-bg)}.sch .k-rouge{--k:var(--kc-rouge);--kb:var(--kc-rouge-bg)}
.sch .k-vert{--k:var(--kc-vert);--kb:var(--kc-vert-bg)}.sch .k-orange{--k:var(--kc-orange);--kb:var(--kc-orange-bg)}
.sch .k-violet{--k:var(--kc-violet);--kb:var(--kc-violet-bg)}.sch .k-jaune{--k:var(--kc-jaune);--kb:var(--kc-jaune-bg)}
.sch .k-gris{--k:var(--kc-gris);--kb:var(--kc-gris-bg)}.sch .k-encre{--k:var(--ink);--kb:var(--surface-2)}
.sch .f{fill:var(--kb,var(--surface-2));stroke:var(--k,var(--ink));stroke-width:1.6}
.sch .plein{fill:color-mix(in srgb,var(--k) 55%,var(--surface));stroke:var(--k);stroke-width:1.2}
.sch .vide{fill:var(--surface);stroke:var(--k,var(--ink));stroke-width:1.2}
.sch .l{stroke:var(--k,var(--ink));fill:none}
.sch .p{fill:var(--k,var(--ink))}
.sch text.t,.sch tspan.t{fill:var(--k,var(--ink))}
.sch text.mute,.sch tspan.mute{fill:var(--ink-soft)}
.sch .axe{stroke:var(--ink)}.sch .axe-p{fill:var(--ink)}
.sch .lien{stroke:var(--ink-soft)}
.sch .grille{stroke:var(--line);stroke-width:1}
.sch .cellule{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.sch .cadran{fill:var(--surface);stroke:var(--ink)}
.sch text.res{fill:var(--kc-vert)}.sch text.reste{fill:var(--kc-rouge)}.sch text.baisse{fill:var(--kc-violet)}
.sch text.zero{fill:var(--kc-orange);font-weight:700}
.sch .trait{stroke:var(--ink);fill:none;stroke-width:2}
.sch .fond{fill:var(--surface-2);stroke:var(--line)}
.sch-err{color:var(--bad);background:var(--bad-bg)}
.semaine.cur{border:3px solid var(--accent);background:linear-gradient(180deg,var(--tint),var(--surface) 120px)}
.semaine.passee{opacity:.8}
.semaine .sec-title{margin-bottom:8px}
.tag{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;border:2px solid var(--line);color:var(--ink-soft);white-space:nowrap}

/* Skin manga (choisi dans l'espace parents) : une planche de BD. Trame de points, cases au trait noir épais,
   ombres pleines décalées, lignes de vitesse, bulles pour les réponses. Les couleurs des onglets ne bougent pas :
   elles restent le repère pour se retrouver. */
html[data-skin="manga"]{--bg:#fbfaf6;--bg-dot:#dedad0;--surface:#fff;--surface-2:#f4f3ef;--ink:#151417;--ink-soft:#4f4c58;--line:#15141733;
  --trait:#151417;--shadow:4px 4px 0 var(--trait);--lift:6px 6px 0 var(--trait);--r:12px;--r-s:10px}
@media (prefers-color-scheme: dark){html[data-skin="manga"]:not([data-theme="light"]){--bg:#111114;--bg-dot:#2b2b33;--surface:#1c1c21;--surface-2:#26262d;--ink:#f5f5f7;--ink-soft:#b7b5c2;--line:#ffffff2e;--trait:#e8e8ee}}
html[data-skin="manga"][data-theme="dark"]{--bg:#111114;--bg-dot:#2b2b33;--surface:#1c1c21;--surface-2:#26262d;--ink:#f5f5f7;--ink-soft:#b7b5c2;--line:#ffffff2e;--trait:#e8e8ee}
html[data-skin="manga"] body{background-image:radial-gradient(var(--bg-dot) 1.4px,transparent 1.6px),radial-gradient(var(--bg-dot) 1.4px,transparent 1.6px);background-size:14px 14px;background-position:0 0,7px 7px}
html[data-skin="manga"] .top{border-bottom:3px solid var(--trait);box-shadow:none}
html[data-skin="manga"] .top::after{height:8px;background:repeating-linear-gradient(-55deg,var(--trait) 0 3px,transparent 3px 9px)}
html[data-skin="manga"] h2{letter-spacing:.01em;text-shadow:2px 2px 0 color-mix(in srgb,var(--trait) 22%,transparent)}
html[data-skin="manga"] .card{border:3px solid var(--trait);box-shadow:var(--shadow)}
html[data-skin="manga"] .card > h3::before,html[data-skin="manga"] .card .sec-title > h3::before{border-radius:2px;transform:skewX(-18deg)}
html[data-skin="manga"] .btn:not(.ghost){border:2.5px solid var(--trait);box-shadow:3px 3px 0 var(--trait);border-radius:10px}
html[data-skin="manga"] .btn:not(.ghost):active:not([disabled]){box-shadow:0 0 0 var(--trait);transform:translate(3px,3px)}
html[data-skin="manga"] .tab{border:2.5px solid var(--trait);box-shadow:3px 3px 0 var(--trait);border-radius:10px}
html[data-skin="manga"] .tab[aria-current="page"]{border-color:var(--trait);box-shadow:3px 3px 0 var(--trait)}
html[data-skin="manga"] .tab:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--trait)}
html[data-skin="manga"] .pill{border-color:var(--trait)}
html[data-skin="manga"] :is(input[type=text],input[type=number],input[type=date],input[type=password],select,textarea){border:2.5px solid var(--trait);border-radius:10px}
html[data-skin="manga"] .badge{border:3px solid var(--trait);box-shadow:3px 3px 0 var(--trait)}
html[data-skin="manga"] .hello::after{width:520px;height:520px;right:-260px;top:-260px;background:repeating-conic-gradient(color-mix(in srgb,var(--trait) 13%,transparent) 0 3deg,transparent 3deg 10deg)}
/* Les réponses du quiz deviennent des bulles, avec leur pointe. */
html[data-skin="manga"] .fb{position:relative;border-radius:26px;border-color:var(--trait);box-shadow:4px 4px 0 var(--trait);margin-bottom:14px}
html[data-skin="manga"] .fb::after{content:"";position:absolute;left:34px;bottom:-13px;width:20px;height:20px;background:inherit;border:solid var(--trait);border-width:0 3px 3px 0;transform:rotate(45deg) skew(12deg,12deg)}
/* Skin fée : forêt enchantée en pastel. Fond semé de petites étincelles, cartes très arrondies qui brillent doucement,
   un arc-en-ciel sous l'en-tête, une étoile devant les titres. */
html[data-skin="fee"]{--bg:#fff5fb;--bg-dot:#f6c9e6;--bg-dot-2:#ffe08a;--surface:#fff;--surface-2:#fbf0ff;--ink:#3a1f4d;--ink-soft:#7a5a8e;--line:#efd6f4;
  --halo:#e05db3;--shadow:0 2px 0 rgba(214,90,170,.08),0 12px 28px -10px rgba(214,90,170,.38);--lift:0 4px 0 rgba(214,90,170,.1),0 20px 34px -12px rgba(214,90,170,.45);--r:28px;--r-s:20px}
@media (prefers-color-scheme: dark){html[data-skin="fee"]:not([data-theme="light"]){--bg:#1b1029;--bg-dot:#4a2a5e;--bg-dot-2:#6b5a22;--surface:#261638;--surface-2:#311d48;--ink:#fbefff;--ink-soft:#d3b8e3;--line:#4a2f63;--halo:#ff8fd8;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 12px 28px -10px rgba(255,120,210,.25);--lift:0 4px 0 rgba(0,0,0,.3),0 20px 34px -12px rgba(255,120,210,.32)}}
html[data-skin="fee"][data-theme="dark"]{--bg:#1b1029;--bg-dot:#4a2a5e;--bg-dot-2:#6b5a22;--surface:#261638;--surface-2:#311d48;--ink:#fbefff;--ink-soft:#d3b8e3;--line:#4a2f63;--halo:#ff8fd8;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 12px 28px -10px rgba(255,120,210,.25);--lift:0 4px 0 rgba(0,0,0,.3),0 20px 34px -12px rgba(255,120,210,.32)}
html[data-skin="fee"] body{background-image:radial-gradient(var(--bg-dot) 1.8px,transparent 2.2px),radial-gradient(var(--bg-dot-2) 1.2px,transparent 1.6px);background-size:34px 34px,22px 22px;background-position:0 0,11px 13px}
html[data-skin="fee"] .top::after{height:6px;background:linear-gradient(90deg,#ff8fc7,#ffc078,#ffe066,#8ce99a,#74c0fc,#b197fc,#ff8fc7)}
html[data-skin="fee"] h2{text-shadow:0 0 14px color-mix(in srgb,var(--halo) 35%,transparent)}
html[data-skin="fee"] .card{border-color:color-mix(in srgb,var(--halo) 22%,var(--line))}
html[data-skin="fee"] .card > h3::before,html[data-skin="fee"] .card .sec-title > h3::before{content:"✦";width:auto;height:auto;background:none;color:var(--accent);font-size:1.1em;vertical-align:0;margin-right:8px}
html[data-skin="fee"] .btn:not(.ghost),html[data-skin="fee"] .pill{border-radius:999px}
html[data-skin="fee"] .tab{border-radius:24px}
html[data-skin="fee"] :is(input[type=text],input[type=number],input[type=date],input[type=password],select,textarea){border-radius:18px}
html[data-skin="fee"] .badge{border-radius:26px;border-color:color-mix(in srgb,var(--halo) 30%,var(--line))}
html[data-skin="fee"] .hello::after{width:260px;height:260px;right:-70px;top:-80px;background:radial-gradient(circle,color-mix(in srgb,var(--star-l) 55%,transparent),transparent 65%)}
html[data-skin="fee"] .fb{border-radius:24px}
/* Skin préhisto : la caverne. Fond de sable et de cailloux, cartes taillées comme des dalles de pierre,
   une frise d'herbe sous l'en-tête, un os devant les titres. */
html[data-skin="dino"]{--bg:#f7efdf;--bg-dot:#e3cfa8;--bg-dot-2:#cdb48a;--surface:#fffaf0;--surface-2:#f3e8d3;--ink:#3b2a1a;--ink-soft:#6f5a44;--line:#e2d2b3;
  --roche:#8a6d4b;--herbe:#5c940d;--shadow:0 3px 0 rgba(110,80,40,.18),0 10px 22px -10px rgba(110,80,40,.35);--lift:0 5px 0 rgba(110,80,40,.2),0 18px 30px -12px rgba(110,80,40,.42)}
@media (prefers-color-scheme: dark){html[data-skin="dino"]:not([data-theme="light"]){--bg:#1d1710;--bg-dot:#33291c;--bg-dot-2:#40331f;--surface:#2a2117;--surface-2:#352a1d;--ink:#f6ecdc;--ink-soft:#cdb99c;--line:#4a3b28;--roche:#b4936b;--herbe:#94d82d}}
html[data-skin="dino"][data-theme="dark"]{--bg:#1d1710;--bg-dot:#33291c;--bg-dot-2:#40331f;--surface:#2a2117;--surface-2:#352a1d;--ink:#f6ecdc;--ink-soft:#cdb99c;--line:#4a3b28;--roche:#b4936b;--herbe:#94d82d}
html[data-skin="dino"] body{background-image:radial-gradient(ellipse 3px 2px,var(--bg-dot-2) 90%,transparent),radial-gradient(var(--bg-dot) 1.5px,transparent 1.8px);background-size:41px 37px,17px 17px;background-position:5px 9px,0 0}
html[data-skin="dino"] .top::after{height:9px;background:conic-gradient(from -45deg at 50% 0,var(--herbe) 90deg,transparent 0) 0 0/14px 9px repeat-x}
html[data-skin="dino"] .card{border:2.5px solid color-mix(in srgb,var(--roche) 45%,var(--line));border-radius:30px 16px 34px 14px/18px 30px 14px 28px}
html[data-skin="dino"] .card > h3::before,html[data-skin="dino"] .card .sec-title > h3::before{content:"🦴";width:auto;height:auto;background:none;font-size:.95em;vertical-align:0;margin-right:8px}
html[data-skin="dino"] .btn:not(.ghost){border-radius:18px 10px 20px 9px/10px 18px 9px 16px}

</style>

   Excalibur (chevaliers) est celui par défaut ; les autres ajoutent leur style dans la feuille de style (html[data-skin="…"]). */

/* Demande du JSON via sample() puis lit la réponse nous-mêmes : marche aussi là où sample.json manque, et permet d'afficher l'avancement. */
function lireJSON(t){
  t=String(t||'').trim();const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f)t=f[1].trim();
  try{return JSON.parse(t)}catch(e){}
  const i=t.indexOf('{'),j=t.lastIndexOf('}');
  if(i>=0&&j>i){try{return JSON.parse(t.slice(i,j+1))}catch(e){}}
  throw {code:'invalid_json',text:t};
}
async function askJSON(prompt,opts={},onProgress){
  const {text,truncated}=await sample(prompt,{...opts,onText:onProgress?({text})=>onProgress(text.length):undefined});
  if(truncated)throw {code:'invalid_json',text};
  return lireJSON(text);
}

// Schémas : Claude décrit un dessin en quelques lignes, le serveur (schemas.mjs) le transforme en SVG.
const SCHEMAS_AIDE=`Schémas : ajoute 1 à 3 schémas dans la leçon quand un dessin aide vraiment à comprendre (sinon aucun). Mets-les dans "schema" de la section concernée : {"type":"...","corps":"..."} ; les autres sections ont "schema": null.
"corps" est un petit texte, une ligne par élément (sépare les lignes par \\n dans le JSON). Couleurs possibles après « | » : bleu, vert, orange, violet, rouge, jaune, gris. Chaque schéma peut finir par une ligne « legende: phrase courte » (**gras** et *italique* permis). « / » coupe un texte en deux lignes.
Types (n'en utilise pas d'autre) :
- barre (fractions en bandes) : lignes « 3/4 : trois quarts | bleu ».
- droite (droite graduée) : « min: 0 », « max: 2 », « pas: 0,25 » (ou « graduations: 4 » par unité), « etiquettes: 1 » (écart entre les nombres écrits), puis des points « 1,5 : un et demi | vert » ou des zones « entre 0 et 1 : texte ».
- bonds (calcul en sauts) : « depart: 47 », puis « +10 > 57 », « −1 > 56 », et éventuellement « total: 10 − 1 = 9 ».
- numeration (tableau de numération) : une ligne « nombre: 4 507 » par nombre (décimaux permis : « nombre: 12,05 »).
- operation (opération posée, avec retenues) : une seule ligne « calcul: 4578 + 645 » (aussi -, x, : pour la division).
- horloge (cadrans) : lignes « 3:45 : quatre heures moins le quart », option « minutes: non ».
- frise (frise chronologique) : « debut: 1765 », « fin: 1825 », « pas: 10 », puis des dates « 1804 : sacré empereur | violet » ou des périodes « 1799 à 1804 : Consulat | bleu » (années avant J.-C. en négatif).

/* Égalité à trou (« 142 - ___ = 145 - 17 ») : le code trouve lui-même le nombre manquant,
   car l'IA y donne souvent un faux corrigé et son "calcul" ne décrit pas l'égalité. */
function resoudreTrou(question){
  const t=String(question).replace(/_{2,}|…|\.{3}|[□▢■?]/g,'¤');
  const eq=(t.match(/[\d¤(][\d¤ ,.+\-−–×÷*:\/()x]*=[\d¤ ,.+\-−–×÷*:\/()x]*[\d¤)]/)||[])[0];
  if(!eq||eq.split('¤').length!==2||eq.split('=').length!==2)return null;
  const [g,d]=eq.split('='),D=n=>{const a=evalCalcul(g.replace('¤',`(${n})`)),b=evalCalcul(d.replace('¤',`(${n})`));return a===null||b===null?null:a-b};
  const d0=D(0),d1=D(1);if(d0===null||d1===null||d1===d0)return null;
  const v=Math.round(-d0/(d1-d0)*1e6)/1e6,dv=D(v);if(dv===null||Math.abs(dv)>1e-6)return null;
  const n=ecrituresNombre(v)[0],cote=evalCalcul(g.replace('¤',`(${v})`));
  return {v,bon:`Le nombre manquant est ${n} : ${eq.replace('¤',n).replace(/\s+/g,' ').trim()}, les deux côtés font ${ecrituresNombre(cote)[0]}.`};
}
/* Renvoie la question (corrigée si besoin), ou null s'il vaut mieux l'écarter. */
function verifierCalcul(q){
  if(q.type==='vf')return q;
  const trou=resoudreTrou(q.question);
  // Sans champ "calcul", on prend l'opération écrite dans la question (« 245 + 378 = ? »).
  const op=!trou&&(q.calcul||(q.type==='courte'&&(q.question.match(/\d[\d ,.]*(?:\s*[-+×÷−]\s*\(?\d[\d ,.]*\)?)+/)||[])[0]));
  const v=trou?trou.v:op?evalCalcul(op):null;if(v===null)return q;
  const bon=trou?trou.bon:`Le calcul : ${String(op).trim()} = ${ecrituresNombre(v)[0]}.`;
  if(q.type==='courte'){
    if(q.reponses.some(r=>memeNombre(lireNombre(r),v)))return q;
    console.warn('Calcul corrigé',q.question,q.reponses,'→',v);
    return {...q,reponses:ecrituresNombre(v),explication:bon};
  }
  if(q.type==='qcm'){
    if(memeNombre(lireNombre(q.choix[q.bonne]),v))return q;
    const j=q.choix.findIndex(c=>memeNombre(lireNombre(c),v));
    console.warn('Calcul corrigé',q.question,q.choix[q.bonne],'→',v);
    return j>=0?{...q,bonne:j,explication:bon}:null;
  }
  return q;
}
async function genererQuestions(q,diffs){
  const nv=NIVEAU_QUIZ[q.niveau],{erreurs,contenu,faibles,comps,plusieurs}=q.ctx;
  const faites=q.questions.map((x,i)=>({x,r:q.rep[i]}));

  const ratees=faites.filter(o=>o.r&&!o.r.pending&&!o.r.ok).slice(-2).map(o=>o.x.question);
  // Partie fixe d'abord (consignes + leçon), partie variable à la fin : Ollama garde en mémoire
  // la lecture du début de la demande et n'a pas à relire la leçon à chaque question.
  const prompt=`${ROLE()}

${prenom()} fait un questionnaire de ${q.n} questions sur ${plusieurs?'ces leçons (révision de la matière)':'cette leçon'}. Niveau : ${nv.label}. Les questions sont créées au fur et à mesure, d'après ses réponses.
Règles :
- Chaque question doit être parfaitement claire pour un enfant de 9 ans, sans rien à deviner : une seule chose demandée, tous les renseignements utiles donnés, et ce qu'il faut répondre (un nombre, une unité, un mot…). Précise tout ce qui pourrait se comprendre de deux façons. Par exemple, pour une horloge, dis toujours quelle aiguille montre quoi : « la petite aiguille (celle des heures) est sur le 3, la grande aiguille (celle des minutes) est sur le 6 », jamais seulement « l'aiguille est sur le 6 ».
- Chaque question se suffit à elle-même : ${prenom()} ne voit ni la leçon ni les questions d'avant. Ne parle jamais de « la solution », « le problème », « l'exercice » ou « le texte » sans les écrire en entier dans la question : un problème de mathématiques donne tout son énoncé (la situation, les nombres, ce qu'on cherche) avant de poser la question.
- La question ne doit jamais contenir ni laisser voir sa réponse. En français surtout : pour faire conjuguer, accorder ou transformer, donne la forme de départ et la consigne, mais pas le résultat attendu (par exemple « Conjugue le verbe chanter au futur avec nous », et non « Conjugue : nous chanterons »).
- Varie les types d'une question à l'autre : QCM (4 choix), vrai/faux et réponses courtes (un mot, un nombre ou une petite phrase).
- Pour un QCM, les choix vont seulement dans "choix" : ne les recopie pas dans le texte de la question. Pour un vrai/faux, "question" est l'affirmation seule, sans « Vrai ou faux : ».
- difficulte 1 = application directe de la règle, 2 = un peu de réflexion, 3 = question « pointue » qui vérifie la vraie compréhension : piège classique, application à un cas nouveau, raisonnement ou justification.
- En mathématiques, mets des calculs et de petits problèmes. En français, fais manipuler la langue (transformer, classer, accorder).
- Reste dans le programme de CM1 et dans le contenu de la leçon.
- "explication" : 2 phrases courtes, 40 mots au plus : la règle, puis pourquoi c'est la bonne réponse ici (ou pourquoi le piège est faux). ${prenom()} peut demander plus de détails ensuite.
- "indice" : une seule phrase courte (15 mots au plus) qui met sur la piste sans donner la réponse.
- Choix de QCM et réponses courtes : quelques mots seulement.
- Pour "courte", donne dans "reponses" la réponse attendue et ses variantes acceptables.
- Si la réponse d'un QCM ou d'une réponse courte s'obtient par un calcul, écris l'opération complète dans "calcul", avec seulement des nombres, + - × : et des parenthèses (par exemple "4,75 + 13 + 2,50"). Sinon, ne mets pas "calcul".${faibles.length?`\n- Dans son cahier, ${prenom()} se trompe souvent sur ces points : consacre-leur au moins la moitié des questions, avec des exemples nouveaux :\n${faibles.map(e=>'  * '+e).join('\n')}`:''}${erreurs.length?`\n- ${prenom()} s'est déjà trompé sur ces questions, reviens sur les mêmes notions autrement :\n${erreurs.map(e=>'  * '+e).join('\n')}`:''}${comps.length>1?`\n- Pour chaque question, mets dans "competence" l'identifiant de l'objectif du programme qu'elle vérifie, pris dans cette liste :\n${comps.map(id=>`  * ${id} : ${COMP(id).t}`).join('\n')}`:''}

Contenu :
${contenu}

Forme JSON de chaque type de question :
{"questions":[
 {"type":"qcm","question":"...","choix":["...","...","...","..."],"bonne":0,"explication":"...","indice":"...","difficulte":1${comps.length>1?',"competence":"identifiant"':''}},
 {"type":"vf","question":"affirmation à juger","bonne":true,"explication":"...","indice":"...","difficulte":2},
 {"type":"courte","question":"...","reponses":["réponse attendue","variante"],"calcul":"opération si c'est un calcul","explication":"...","indice":"...","difficulte":3}
]}

${historique?`Questions déjà posées (ne les répète pas, change de notion ou d'angle) :
${historique}
`:''}${ratees.length?`${prenom()} vient de se tromper sur : ${ratees.map(t=>'« '+t+' »').join(' et ')}. Reviens sur la même notion autrement, avec un exemple nouveau et plus simple, pour qu'il la comprenne vraiment.
`:''}Crée maintenant ${diffs.length===1?'la question suivante':`les ${diffs.length} questions suivantes`} (n° ${q.questions.length+1}${diffs.length>1?' à '+(q.questions.length+diffs.length):''}), de difficulte : ${diffs.join(', ')}.
Réponds uniquement avec un objet JSON {"questions":[...]} contenant exactement ${diffs.length} question(s).`;
  const r=await askJSON(prompt,{modelTier:'default',cache:false});
  const deja=new Set(q.questions.map(x=>norm(x.question)));
  const qs=(r&&Array.isArray(r.questions)?r.questions:[]).filter(q=>q&&q.question&&['qcm','vf','courte'].includes(q.type)&&!deja.has(norm(q.question)));
  qs.forEach(q=>{
    if(q.type==='qcm'){
      const ch=(q.choix||[]).map((t,i)=>({t:String(t),ok:i===Number(q.bonne)}));
      for(let i=ch.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ch[i],ch[j]]=[ch[j],ch[i]]}
      q.choix=ch.map(c=>c.t);q.bonne=ch.findIndex(c=>c.ok);
    }
    if(q.type==='vf')q.bonne=q.bonne===true||q.bonne==='true'||q.bonne==='vrai';
    if(q.type==='courte')q.reponses=(q.reponses||[]).map(String);
    q.difficulte=Number(q.difficulte)||1;
    q.competence=comps.length===1?comps[0]:comps.includes(q.competence)?q.competence:undefined;
  });
  return qs.filter(q=>q.type!=='qcm'||(q.choix.length>=2&&q.bonne>=0)).map(verifierCalcul).filter(Boolean).slice(0,diffs.length);
}
/* Complète le quiz jusqu'à avoir `jusqua` questions (une seule génération à la fois, 2 essais). */
async function prepareQuestions(q,jusqua){
  if(q.gen||q.questions.length>=Math.min(jusqua,q.n))return;
  const nb=Math.min(jusqua,q.n)-q.questions.length;
  const diffs=[];for(let k=0;k<nb;k++)diffs.push(k===0?difficulteVisee(q):Math.min(3,diffs[k-1]+1));
  q.gen=true;q.genErr=null;
  try{
    let qs=[];
    for(let essai=0;essai<2&&!qs.length;essai++){try{qs=await genererQuestions(q,diffs)}catch(e){if(essai)throw e}}
    if(!qs.length)throw {code:'invalid_json'};
    q.questions.push(...qs.slice(0,q.n-q.questions.length));
  }catch(e){q.genErr=errMsg(e)}
  q.gen=false;
  if(state.quiz!==q)return;
  // On ne redessine que si l'enfant attendait cette question : sinon on effacerait ce qu'il est en train d'écrire.
  const attendait=q.loading||q.i>=q.questions.length-(q.genErr?0:1)&&!q.fini;
  if(q.loading){q.loading=false;if(!q.questions.length)q.err=q.genErr}
  if(attendait)render();
  if(!q.genErr)prefetchQuiz();
}
/* Dès que la 1re question est là, on enchaîne la génération des suivantes, une par une,
   sans attendre les réponses ; chacune tient compte des réponses déjà données à ce moment-là. */
function prefetchQuiz(){
  const q=state.quiz;if(!q||q.fini)return;
  prepareQuestions(q,q.questions.length+1);
}
/* Hors français, l'orthographe ne compte pas : on compare une forme « phonétique » simplifiée
   et on accepte quelques lettres de travers. Les nombres, eux, doivent être exacts. */
function lev(a,b){let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
const phon=s=>norm(s).replace(/[,.]/g,' ').replace(/ph/g,'f').replace(/qu|c(?=[aou])|ck|k/g,'k').replace(/c(?=[eiy])/g,'s').replace(/y/g,'i').replace(/h/g,'').replace(/eau|au/g,'o').replace(/ai|ei/g,'e').replace(/(?<=[a-z]{2})(es|ent|s|x|t|d|e)\b/g,'').replace(/([a-z])\1+/g,'$1').replace(/\s+/g,' ').trim();
const chiffres=s=>(String(s).match(/\d+/g)||[]).join(' ');
function procheOrtho(v,a){
  if(chiffres(v)!==chiffres(a))return false;
  const b=phon(a),w=phon(v).split(' ');if(!b)return false;
  const tol=b.length<4?0:b.length<8?1:Math.floor(b.length/5),nb=b.split(' ').length;
  for(let k=0;k<=Math.max(0,w.length-nb);k++){for(const m of[nb-1,nb,nb+1]){if(m<1)continue;if(lev(w.slice(k,k+m).join(' '),b)<=tol)return true}}
  return false;
}
async function verifierCourte(q,rep,francais){
  const r=await askJSON(`${ROLE()}

Question posée à ${prenom()} : « ${q.question} »
Réponses attendues : ${q.reponses.join(' / ')}
Réponse ${deP()} : « ${rep} »
La réponse ${deP()} est-elle juste sur le fond ? ${francais?"Sois bienveillant sur l'orthographe si le sens est bon, mais exigeant sur la notion.":"Ce n'est pas une question de français : ne tiens AUCUN compte de l'orthographe, de la grammaire, de la conjugaison, des accents ni de la ponctuation. Un mot mal écrit mais reconnaissable compte comme juste ; seul le sens compte, et ne parle pas de l'orthographe dans le commentaire."}
Si c'est faux, le commentaire dit ce qui est juste dans sa réponse, puis où est l'erreur et pourquoi.
Réponds uniquement en JSON : {"correct":true,"commentaire":"1 ou 2 phrases pour ${prenom()}"}`,{modelTier:'quick'});
  return {ok:!!(r&&(r.correct===true||r.correct==='true')),commentaire:r&&r.commentaire?String(r.commentaire):''};
}

/* ============ Calculs : étoiles, séries, badges, révisions ============ */
function quizPct(q){return q.total?q.score/q.total:0}
/* Les 3 règles des étoiles, depuis le 22/10/2026 :
   1. chaque bonne réponse (quiz, défi éclair) : +1 ;
   2. chaque chose finie (quiz ou défi terminé, devoir coché, leçon rangée, note rentrée,
      code du chevalier complet, tâche de vacances) : +5 ;
   3. sans faute : les étoiles du quiz sont doublées.
   Ce qui a été gagné avant garde l'ancien barème : le trésor ne baisse jamais. */
const REGLES_3='2026-10-22';
const neuf=date=>String(date||'')>=REGLES_3;
const jourDe=x=>x.createdAt?isoDay(new Date(x.createdAt)):x.date;
const ptsDevoir=d=>neuf(d.faitLe)?5:d.faitLe<=d.pour?5:2;
const ptsRoutine=(date,n)=>neuf(date)?(n===ROUTINE.length?5:0):n+(n===ROUTINE.length?3:0);
const ptsNote=n=>{const p=n.valeur/n.sur;return neuf(jourDe(n))?5:p>=.8?10:p>=.6?5:2};
const ptsLecon=l=>neuf(jourDe(l))?5:3;
const ptsVac=(k,date)=>neuf(date)?5:{lu:2,rentree:2,bonus:1}[k];
const bonusMission=date=>neuf(date)?0:5;
function bilan(){
  const g=[];
  all('quiz').filter(q=>q.termine&&!q.valide).forEach(q=>g.push({pts:q.etoiles||0,date:q.date,why:'Quiz : '+q.titre}));
  all('devoirs').filter(d=>d.fait&&d.faitLe).forEach(d=>g.push({pts:ptsDevoir(d),date:d.faitLe,why:'Devoir fait : '+d.titre}));
  all('routine').forEach(r=>{const n=ROUTINE.filter(it=>r.items&&r.items[it.id]).length;const pts=ptsRoutine(r.id,n);if(pts)g.push({pts,date:r.id,why:n===ROUTINE.length?'Routine complète':'Routine du jour'})});
  all('notes').forEach(n=>{g.push({pts:ptsNote(n),date:n.date,why:'Note : '+n.intitule})});
  all('lecons').filter(l=>!l.importe&&!l.special).forEach(l=>g.push({pts:ptsLecon(l),date:l.date,why:'Leçon ajoutée : '+l.titre}));
/* Monter du niveau n au suivant (n compté depuis 0) coûte 150 étoiles, puis 25 de plus à chaque niveau.
   Le niveau 50 demande 36 750 étoiles au total : plusieurs années de travail. */
const coutNiveau=n=>150+25*n;
function niveauDe(total){
  const max=SK().niveaux.length-1;
  let niveau=0,reste=total;
  while(niveau<max&&reste>=coutNiveau(niveau)){reste-=coutNiveau(niveau);niveau++}
  return {niveau,nomNiveau:SK().niveaux[niveau],maxi:niveau===max,dansNiveau:reste,coutSuivant:coutNiveau(niveau)};
}
  plansVac().forEach(p=>{
    Object.keys(p.lu||{}).filter(d=>p.lu[d]).forEach(d=>g.push({pts:ptsVac('lu',d),date:d,why:'Lecture de vacances'}));
    Object.keys(p.rentree||{}).filter(d=>p.rentree[d]).forEach(d=>g.push({pts:ptsVac('rentree',d),date:d,why:'Rentrée préparée'}));
    Object.keys(p.bonus||{}).filter(d=>p.bonus[d]).forEach(d=>g.push({pts:ptsVac('bonus',d),date:d,why:'Idée bonus des vacances'}));
    p.jours.filter(j=>missionFaite(p,j)&&bonusMission(j.date)).forEach(j=>g.push({pts:bonusMission(j.date),date:j.date,why:'Mission de vacances complète'}));
  });
  g.sort((a,b)=>a.date<b.date?1:-1);
  const total=g.reduce((s,x)=>s+x.pts,0);
  const spent=all('achats').filter(a=>a.statut!=='refusé').reduce((s,a)=>s+(Number(a.cout)||0),0);
  return {gains:g,total,spent,solde:total-spent,...niveauDe(total)};
}

/* Étoiles d'un quiz ou d'un défi éclair (règles 1 à 4), calculées à la fin puis enregistrées avec le quiz.
   Règle 4, pour qu'il ne gagne pas en refaisant ce qu'il sait déjà : un quiz Facile ou un défi des tables de 2, 5 ou 10
   rapporte moitié moins, comme un quiz déjà réussi (80 % ou plus) dans la semaine ; réussi 2 fois ou plus : le quart.
   bonusJour marque le quiz de la leçon du jour, pour en proposer une autre ensuite. */
function calculEtoiles(q){
  const parfait=q.total>0&&q.score===q.total,d=[];
  let pts=q.score+5;d.push(`${q.score} bonne${q.score>1?'s':''} réponse${q.score>1?'s':''} : +${q.score}`,`${q.defi?'Défi':'Quiz'} terminé : +5`);
  if(parfait){pts*=2;d.push('Sans faute : étoiles doublées')}
  if(q.defi?q.type==='tables'&&[2,5,10].includes(Number(q.n)):q.niveau==='facile'){pts/=2;d.push(q.defi?'Table facile : moitié des étoiles':'Quiz Facile : moitié des étoiles')}
  const cle=(q.leconIds||[]).join(',');
  const reussis=all('quiz').filter(x=>x.termine&&!x.valide&&(x.leconIds||[]).join(',')===cle&&x.createdAt>Date.now()-7*864e5&&quizPct(x)>=.8).length;
  if(reussis){pts/=reussis>=2?4:2;d.push(reussis>=2?`Déjà réussi ${reussis} fois cette semaine : le quart des étoiles`:'Déjà réussi cette semaine : moitié des étoiles')}
  pts=Math.max(1,Math.round(pts));
  const ej=!q.defi&&etoileDuJour();
  return {pts,detail:d,bonusJour:!!(ej&&q.leconIds.length===1&&q.leconIds[0]===ej.id)};
}

/* Une leçon du dossier présentée comme une leçon du cahier, pour réutiliser le générateur de quiz. */
function refLecon(id){
  const c=String(id).startsWith('ref:')&&cours(id);if(!c)return null;
  return {id:'ref:'+c.id,ref:true,titre:c.titre,matiere:c.matiere,notions:[],competences:c.objectifs.filter(COMP),resume:'Leçon de référence du programme de CM1.',cours:{},
    transcription:c.texte,pointsFaibles:all('lecons').filter(l=>(l.competences||[]).some(x=>c.objectifs.includes(x))).flatMap(l=>l.pointsFaibles||[]).slice(0,6)};
}
function quizRef(id){const qs=all('quiz').filter(q=>q.termine&&!q.valide&&(q.leconIds||[]).includes('ref:'+id));return qs.length?Math.max(...qs.map(quizPct)):revValidee(id)?1:null}
/* Révision validée à la main (valide:true) : ni questions ni étoiles, affichée « révisée ✓ ». */
const revValidee=id=>all('quiz').some(q=>q.valide&&(q.leconIds||[]).includes('ref:'+id));
function itemCours(x){
  const c=cours(x.id);if(!c)return '';const best=quizRef(c.id);
  return `<div class="item clickable" data-act="cours" data-id="${esc(c.id)}"><div class="grow"><div class="t">${esc(c.titre)}</div><div class="small muted row" style="gap:6px">${mchip(c.matiere)}${x.revision?'<span class="tag">révision</span>':''}${c.complement?'<span class="tag">pour aller plus loin</span>':''}${revValidee(c.id)?'<span class="tag">révisée ✓</span>':''}${best!==null&&all('quiz').some(q=>q.termine&&!q.valide&&(q.leconIds||[]).includes('ref:'+c.id))?`<span>meilleur quiz ${Math.round(best*100)} %</span>`:''}</div></div>
    ${sample?`<button class="btn small" data-act="quiz-lecon" data-id="ref:${esc(c.id)}" data-niveau="normal">Quiz</button>`:''}<span aria-hidden="true">›</span></div>`;
}
function etatTravail(){
  const c={maitrise:0,ajour:0,revoir:0,jamais:0};
  all('lecons').forEach(l=>{const e=etatLecon(l);if(e.best===null)c.jamais++;else if(e.due)c.revoir++;else if(e.best>=.9)c.maitrise++;else c.ajour++});
  const t=TODAY(),lun=mondayOf(t),dim=addDays(lun,6);
  const dv=all('devoirs').filter(d=>d.pour>=lun&&d.pour<=dim);
  return {...c,total:all('lecons').length,dvFaits:dv.filter(d=>d.fait).length,dvTotal:dv.length,retard:all('devoirs').filter(d=>!d.fait&&d.pour<t).length};
}
function renderStrip(){
  const el=document.getElementById('strip');if(!el)return;
  // Seulement dans « Mon année » et chez les parents (choix de la zone) : l'accueil reste dégagé.
  el.hidden=!['annee','parents','programme'].includes(state.view);if(el.hidden)return;
  if(document.activeElement&&document.activeElement.id==='zone-sel')return;
  const t=TODAY(),vac=vacancesAnnee(),zone=cfg().zone||ZONE_DEFAUT;
  const len=daysBetween(ANNEE.debut,ANNEE.fin);
  const P=d=>Math.max(0,Math.min(100,100*daysBetween(ANNEE.debut,d)/len));
  const enCours=vac.find(([,a,b])=>t>=a&&t<b),proch=vac.find(([,a])=>a>t);
  let titre,detail;
  if(t<ANNEE.debut){titre='Bientôt la rentrée';detail=`Rentrée ${dansJours(daysBetween(t,ANNEE.debut))}`}
  else if(enCours){titre=`<span class="vacn">${esc(enCours[0])} !</span>`;detail=enCours[2]>ANNEE.fin?'Bonnes vacances !':`Reprise ${esc(longDate(enCours[2]))} (${dansJours(daysBetween(t,enCours[2]))})`}
  else{const s=semainesClasse(vac);titre=`Semaine ${s.n} sur ${s.total}`;detail=proch?`${esc(proch[0])} ${dansJours(daysBetween(t,proch[1]))}`:''}
  const zoneSel=`<select id="zone-sel" aria-label="Zone de vacances" title="Zone de vacances scolaires"><option value="">Zone ?</option>${['A','B','C'].map(z=>`<option value="${z}" ${z===zone?'selected':''}>Zone ${z}</option>`).join('')}</select>`;
  const seg=vac.filter(([,a])=>a<ANNEE.fin).map(([n,a,b])=>`<i class="vac" style="left:${P(a)}%;width:${P(b)-P(a)}%" title="${esc(n)} : du ${esc(shortDate(a))} au ${esc(shortDate(addDays(b,-1)))}"></i>`).join('');
  const fer=ANNEE.feries.map(([n,a,b])=>daysBetween(a,b)>1?`<i class="vac" style="left:${P(a)}%;width:${P(b)-P(a)}%" title="${esc(n)}"></i>`:`<i class="fer" style="left:${P(a)}%" title="${esc(n)}"></i>`).join('');
  const mois=MOIS.map((m,i)=>{const d=isoDay(new Date(2026,8+i,1,12));return `<span style="left:${P(d)}%">${m}</span>`}).join('');
  const w=etatTravail(),tot=w.total||1;
  const parts=[['maitrise','var(--ok)','maîtrisée','maîtrisées'],['ajour','var(--accent)','révisée','révisées'],['revoir','var(--warn)','à revoir','à revoir'],['jamais','var(--seyes-strong)','pas encore testée','pas encore testées']];
  const pct=w.total?Math.round(100*(w.maitrise+w.ajour)/w.total):0;
  el.innerHTML=`<div class="wrap">
    <div class="sb"><div class="sb-head"><span><b>${titre}</b>${detail?` · ${detail}`:''}</span><span class="row" style="gap:6px">${t>=ANNEE.debut&&t<ANNEE.fin?`<span class="muted">${Math.round(P(t))} % de l'année</span>`:''}${zoneSel}</span></div>
      <div class="ytrack" role="img" aria-label="Année scolaire du 1er septembre 2026 au 3 juillet 2027, aujourd'hui ${esc(longDate(t))}"><i class="past" style="width:${P(t)}%"></i>${seg}${fer}<i class="now" style="left:${P(t)}%" title="Aujourd'hui"></i></div>
      <div class="months" aria-hidden="true">${mois}</div></div>
    <div class="sb"><div class="sb-head"><span><b>Mes révisions</b> · ${loading()?'…':w.total?`${w.maitrise+w.ajour} leçon${w.maitrise+w.ajour>1?'s':''} sur ${w.total} à jour`:'aucune leçon pour l\'instant'}</span><span class="muted">${w.total?pct+' %':''}</span></div>
      <div class="pbar" role="img" aria-label="${w.maitrise} maîtrisées, ${w.ajour} révisées, ${w.revoir} à revoir, ${w.jamais} pas encore testées">${parts.map(([k,c])=>w[k]?`<i style="width:${100*w[k]/tot}%;background:${c}"></i>`:'').join('')}</div>
      <div class="leg">${parts.filter(([k])=>w[k]).map(([k,c,l1,l2])=>`<span style="--c:${c}">${w[k]} ${w[k]>1?l2:l1}</span>`).join('')}${w.dvTotal?`<span style="--c:var(--star)">Devoirs de la semaine ${w.dvFaits}/${w.dvTotal}</span>`:''}${w.retard?`<span class="late" style="--c:var(--bad)">${w.retard} en retard</span>`:''}</div></div>
  </div>`;
}
