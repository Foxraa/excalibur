function go(view,param){state.view=view;state.param=param||null;state.confirm=null;if(view!=='quiz'&&state.quiz&&state.quiz.fini)state.quiz=null;render();window.scrollTo({top:0})}
let dirty=false;
function requestRender(force){
  if(!force){
    if(state.view==='quiz'&&state.quiz&&!state.quiz.fini){dirty=true;renderHeader();return}
    const a=document.activeElement;
    if(a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox'){dirty=true;renderHeader();return}
  }
  render();
}
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(dirty&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))&&!(state.view==='quiz'&&state.quiz&&!state.quiz.fini)){dirty=false;render()}},150));

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('toast').appendChild(t);setTimeout(()=>t.remove(),3200)}
function confettis(){const cols=['var(--star)','var(--accent)','var(--marge)','var(--ok)'];for(let i=0;i<36;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%4];c.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2400)}}
function gagne(n,msg){toast(`+${n} étoile${n>1?'s':''} ! ${msg||''}`);if(n>=10)confettis();setTimeout(checkBadges,400)}
/* Les badges déjà annoncés sont gardés dans config/badges : seul un badge jamais annoncé déclenche un message. */
function checkBadges(){
  if(storeMode==='loading'||(storeMode==='db'&&loadedCols.size<COLS.length))return;
  const now=BADGES.filter(b=>b.test()).map(b=>b.id);const doc=S.config.get('badges');
  if(!doc){put('config','badges',{vus:now});return}
  const vus=doc.vus||[];const neufs=now.filter(id=>!vus.includes(id));if(!neufs.length)return;
  put('config','badges',{vus:[...vus,...neufs]});
  const noms=neufs.map(id=>nomBadge(BADGES.find(x=>x.id===id)));
  toast((noms.length>1?'Nouveaux badges : ':'Nouveau badge : ')+noms.join(', ')+' !');confettis();
}

/* ============ Rendu ============ */
function renderHeader(){
  renderStrip();
  document.getElementById('devise').textContent=SK().devise();
  const skin=skinId();
  if(document.documentElement.dataset.skin!==skin){document.documentElement.dataset.skin=skin;document.querySelector('#brand svg').outerHTML=LOGO[skin];majIcone(skin)}
  const b=bilan();
  const pct=b.maxi?100:Math.floor(b.dansNiveau/b.coutSuivant*100);
  document.getElementById('wallet').innerHTML=`<span class="pill or" title="Étoiles disponibles">${STAR}<span>${b.solde}</span></span><span class="pill niv" title="${b.maxi?'Niveau maximum atteint !':`Encore ${b.coutSuivant-b.dansNiveau} étoiles pour devenir ${esc(SK().niveaux[b.niveau+1])}`}"><span>Niv. ${b.niveau+1}<span class="nom"> · ${esc(b.nomNiveau)}</span></span><span class="mini-bar" role="progressbar" aria-label="Vers le niveau suivant" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></span><span class="small muted">${b.maxi?'max':`${b.dansNiveau}/${b.coutSuivant}`}</span></span>`;
  const cur=state.view in GROUPE?GROUPE[state.view]:state.view;
  document.getElementById('fab').hidden=['quiz','defi','ajouter'].includes(state.view);
  const vac=modeVac();if(vac)document.documentElement.dataset.vac='1';else delete document.documentElement.dataset.vac;
  // La page prend la couleur de l'onglet ouvert (le quiz garde celle d'où l'on vient).
  if(cur)document.documentElement.dataset.sec=cur;

function nudge(){
  const t=TODAY();const dv=all('devoirs').filter(d=>!d.fait);
  const retard=dv.filter(d=>d.pour<t),demain=dv.filter(d=>d.pour===addDays(t,1)),auj=dv.filter(d=>d.pour===t);
  const s=serie();const h=new Date().getHours();
  if(retard.length)return `Il reste ${retard.length} devoir${retard.length>1?'s':''} en retard. On s'y met ? Cinq minutes suffisent pour commencer.`;
  if(auj.length)return `Tu as ${auj.length} chose${auj.length>1?'s':''} à faire pour aujourd'hui. Coche-les dès que c'est fait !`;
  if(demain.length&&h>=15)return `Pour demain : ${demain.map(d=>d.titre).join(', ')}. C'est le bon moment pour le faire.`;
  if(!s.aujourdhui&&s.n>=2)return `Tu as travaillé ${s.n} jours de suite. Ne casse pas ta série : un petit quiz et c'est gagné !`;
  if(!s.aujourdhui)return h<12?SK().matin:SK().aprem;
  if(s.n>=3)return SK().serie(s.n);
  return "Tu as déjà travaillé aujourd'hui. "+SK().fier;
}

function missionDuJour(){
  const t=TODAY(),dv=all('devoirs').filter(d=>!d.fait).sort((a,b)=>a.pour<b.pour?-1:1);
  const d=dv.find(x=>x.pour<t)||dv.find(x=>x.pour===t)||dv.find(x=>x.pour===addDays(t,1));
  if(d){const l=['Contrôle','Leçon à apprendre','Révision'].includes(d.type)&&leconsLiees(d)[0];
    return {devoir:true,ico:'✏️',titre:d.titre,detail:`${M(d.matiere).nom} · ${d.type||'Devoir'} ${d.pour<t?'en retard':d.pour===t?"pour aujourd'hui":'pour demain'}${d.detail?' · '+d.detail:''}`,
    btn:`${l?`<button class="btn" data-act="lecon" data-id="${l.id}">📖 Relire « ${esc(l.titre)} »</button>${sample?`<button class="btn" data-act="quiz-lecon" data-id="${l.id}" data-niveau="normal">Me tester</button>`:''}`:''}<button class="btn primary big" data-act="devoir-ok" data-id="${d.id}">C'est fait !</button><button class="btn" data-act="tab" data-v="devoirs">Tous mes devoirs</button>`}}
  const ej=etoileDuJour(),l=ej||(aReviser()[0]||{}).l;
  if(l)return {ico:'📖',titre:`Relis « ${l.titre} », puis fais le quiz`,detail:`${M(l.matiere).nom} · ${etatLecon(l).raison}${ej?" · leçon du jour":''}`,

  if(p){const sp=speciale(p.c.id);return {ico:'🎯',titre:p.c.t,detail:`${M(p.c.m).nom} · un point à retravailler`,
    btn:`<button class="btn primary big" data-act="quiz-comp" data-id="${p.c.id}">M'entraîner</button>${sp?`<button class="btn" data-act="lecon" data-id="${sp.id}">Ma leçon spéciale</button>`:`<button class="btn" data-act="speciale" data-id="${p.c.id}" ${state.special&&state.special.busy?'disabled':''}>Une leçon rien que pour moi</button>`}`}}
  const sd=COURS&&semaineDuJour(),s=sd&&COURS.semaines.find(x=>x.n===sd.n),c=s&&s.items.map(x=>cours(x.id)).find(x=>x&&quizRef(x.id)===null);
  if(c)return {ico:'📖',titre:`Lis la leçon « ${c.titre} »`,detail:`${M(c.matiere).nom} · prévue ${sd.maintenant?'cette semaine en classe':'à la rentrée'}`,
    btn:`<button class="btn primary big" data-act="cours" data-id="${esc(c.id)}">Ouvrir la leçon</button>`};
  return {ico:'📷',titre:'Ajoute ce que tu as fait en classe',detail:"Prends ton cahier en photo : je t'en fais une fiche et un quiz.",
    btn:`<button class="btn primary big" data-act="tab" data-v="ajouter">Prendre une photo</button>`};
}

function vMatieres(){
  const lec=all('lecons');

/* ---- Programme officiel ---- */
const PROG_MATS=['francais','maths','histoire','geographie','sciences','emc'];
const ETATS={avenir:'Pas encore vu',vu:'Vu en classe',fragile:'À retravailler',progres:'En bonne voie',acquis:'Je sais !'};
const ETAT_COUL={acquis:'var(--ok)',progres:'var(--accent)',vu:'var(--seyes-strong)',fragile:'var(--warn)'};
/* Suivi automatique : chaque réponse de quiz, exercice corrigé, note ou point faible du cahier
   est une « preuve » rattachée à un objectif. Les plus récentes comptent davantage. */
var preuvesCache=null;
function bonneRep(x){return x.type==='qcm'?x.choix[x.bonne]:x.type==='vf'?(x.bonne?'Vrai':'Faux'):(x.reponses||[])[0]}
function preuves(){
  if(preuvesCache)return preuvesCache;
  const P=new Map();const add=(id,p)=>{if(!COMP(id))return;if(!P.has(id))P.set(id,[]);P.get(id).push(p)};
  all('quiz').filter(q=>q.termine).forEach(q=>{
    const ts=q.createdAt||D(q.date);
    const def=[...new Set([...(q.competences||[]),...(q.leconIds||[]).filter(x=>String(x).startsWith('prog:')).map(x=>String(x).slice(5))])];
    (q.questions||[]).forEach((x,i)=>{const r=q.reponses&&q.reponses[i];if(!r)return;
      (COMP(x.competence)?[x.competence]:def).forEach(id=>add(id,{ts,ok:r.ok?1:0,poids:1,src:'quiz',question:x.question,rep:r.v,bonne:bonneRep(x)}))});
  });
  all('lecons').forEach(l=>{const ts=l.createdAt||D(l.date);const ex=(l.exercices||[]).filter(e=>e.juste===true||e.juste===false);
    (l.competences||[]).forEach(id=>{
      ex.forEach(e=>add(id,{ts,seance:D(l.date),ok:e.juste?1:0,poids:1,src:'cahier',question:e.enonce,rep:e.reponseEleve,bonne:e.bonneReponse}));
      // Points faibles sans exercice corrigé : un signal, sauf pour le classeur importé (couvert par le bilan de départ) et les leçons spéciales.
      if(!ex.length&&(l.pointsFaibles||[]).length&&!l.importe&&!l.special)add(id,{ts,seance:D(l.date),ok:0,poids:2,src:'faible'});
    })});
  // Une note reliée par devinette compte un peu moins qu'une note reliée par l'IA.
  all('notes').forEach(n=>(n.competences||[]).forEach(id=>add(id,{ts:n.createdAt||D(n.date),ok:n.valeur/n.sur,poids:n.lien==='auto'?2:3,src:'note'})));
  return preuvesCache=P;
}
/* jusqua (timestamp, facultatif) : l'état tel qu'il était à cette date, pour le bilan de la semaine.
   Le travail du cahier compte à la date de la séance (seance), pas à la date où la photo a été rangée. */
function etatComp(c,jusqua){
  const avant=ts=>!jusqua||ts<=jusqua;
  const lecons=all('lecons').filter(l=>(l.competences||[]).includes(c.id)&&avant(D(l.date)));
  const devoirs=all('devoirs').filter(d=>(d.competences||[]).includes(c.id)&&avant(d.createdAt||D(d.pour)));
  const notes=all('notes').filter(n=>(n.competences||[]).includes(c.id)&&avant(n.createdAt||D(n.date)));
  const P=(preuves().get(c.id)||[]).filter(p=>avant(p.seance||p.ts)).slice().sort((a,b)=>b.ts-a.ts);
  let sw=0,so=0;P.forEach((p,i)=>{const w=p.poids*Math.pow(.9,i);sw+=w;so+=w*p.ok});
  const score=sw?so/sw:null;
  const nb=P.reduce((s,p)=>s+(p.src==='note'?3:p.src==='faible'?0:1),0);
  const dernier=P.length?P[0].ts:0;
  const auto=score===null?(lecons.length||devoirs.length?'vu':'avenir'):score>=.8&&nb>=4?'acquis':score>=.6?'progres':'fragile';
  // Un choix à la main (ou le bilan de départ) vaut jusqu'à la prochaine preuve.
  const man=S.programme.get(c.id);const manTs=man?(man.ts||D(man.date)):0;
  // Le bilan de départ compte comme connu depuis toujours : ce n'est pas un progrès de la semaine.
  const manuel=man&&ETATS[man.etat]&&manTs>=dernier&&(man.source==='bilan'||avant(manTs));
  const quiz=P.filter(p=>p.src==='quiz');
  const erreurs=P.filter(p=>p.src!=='faible'&&p.src!=='note'&&!p.ok);
  return {etat:manuel?man.etat:auto,manuel:manuel?(man.source==='bilan'?'bilan':'main'):null,score,nb,lecons,devoirs,notes,dernier,erreurs,
    nbQuiz:quiz.length,okQuiz:quiz.filter(p=>p.ok).length,best:score};
}
function resumePreuves(e){
  const t=[];if(e.nbQuiz)t.push(`${e.okQuiz}/${e.nbQuiz} bonnes réponses en quiz`);
  if(e.notes.length)t.push(e.notes.map(n=>`${fmtN(n.valeur)}/${n.sur}`).join(', ')+' en évaluation');
  if(e.devoirs.length)t.push(`${e.devoirs.length} devoir${e.devoirs.length>1?'s':''}`);
  if(e.manuel==='bilan')t.push('d\'après le bilan du classeur');else if(e.manuel==='main')t.push('choisi à la main');
  return t.join(' · ');
}
/* Ce que l'enfant devrait travailler maintenant, du plus urgent au moins urgent. */
function planTravail(mat){
  const prio={fragile:3,vu:2,progres:1};
  return COMPETENCES.filter(c=>!mat||c.m===mat).map(c=>({c,e:etatComp(c)})).filter(x=>prio[x.e.etat])
    .sort((a,b)=>prio[b.e.etat]-prio[a.e.etat]||(a.e.score??1)-(b.e.score??1)||b.e.lecons.length-a.e.lecons.length);
}

/* Schémas des leçons du cahier : le serveur transforme {type, corps} en SVG (schemas.mjs). */
const SCH=new Map(),SCH_ATTENTE=new Set();let schTimer=0;
const schCle=x=>x&&typeof x==='object'&&x.type&&x.corps?JSON.stringify([String(x.type),String(x.corps)]):'';
function schHtml(x){
  const k=schCle(x);if(!k)return '';
  if(SCH.has(k))return SCH.get(k);
  SCH_ATTENTE.add(k);clearTimeout(schTimer);schTimer=setTimeout(chargerSchemas,0);
  return '<div class="sch-load small muted">Je dessine le schéma…</div>';
}
async function chargerSchemas(){
  const cles=[...SCH_ATTENTE].filter(k=>!SCH.has(k));SCH_ATTENTE.clear();if(!cles.length)return;
  cles.forEach(k=>SCH.set(k,''));
  try{
    const r=await fetch('/api/schemas',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({blocs:cles.map(k=>{const [type,corps]=JSON.parse(k);return {type,corps}})})});
    if(!r.ok)throw r.status;const {html=[]}=await r.json();
    cles.forEach((k,i)=>SCH.set(k,String(html[i]||'')));
  }catch(e){console.warn('schemas',e);cles.forEach(k=>SCH.set(k,''))}
  requestRender();
}

/* L'icône de l'onglet reprend le logo du skin ; Excalibur garde celle écrite dans l'en-tête de la page.
   Une icône ne lit pas les variables CSS : on y met des couleurs fixes. */
const ICONE_EXCALIBUR=document.querySelector('link[rel="icon"]').href;
function majIcone(skin){
  const svg=LOGO[skin].replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ').replace(/var\(--trait\)/g,'#151417').replace(/var\(--accent\)/g,'#d9480f').replace(/var\(--surface\)/g,'#fff');
  document.querySelector('link[rel="icon"]').href=skin==='excalibur'?ICONE_EXCALIBUR:'data:image/svg+xml,'+encodeURIComponent(svg);
}
const HIBOU_SKIN={excalibur:HIBOU,manga:HIBOU_MANGA,fee:HIBOU_FEE,dino:HIBOU_DINO};
/* Durée écoulée au format m:ss (0:00, 1:05, 10:00). */
function duree(ms){const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
const casesPhotos=c=>Array.from({length:c.n},(_,k)=>`<span class="case${k<c.i-1?' faite':k===c.i-1?' en-cours':''}"></span>`).join('');
/* Bloc d'attente. o.debut : affiche le temps écoulé depuis cet instant, mis à jour chaque seconde ;
   o.charge {i,n} : une case par photo (la i-ième en cours) ; o.sous : une petite ligne sous le texte. */
function attente(texte,o={}){
  return `<div class="thinking"${o.charge?' data-charge':''}>${HIBOU_SKIN[skinId()]}<div class="attente-txt"><span data-progress>${texte}${o.debut?` <span data-chrono="${o.debut}">${duree(Date.now()-o.debut)}</span>`:''}</span>${o.charge?`<span class="cases">${casesPhotos(o.charge)}</span>`:''}${o.sous?`<span class="small muted">${o.sous}</span>`:''}</div></div>`;
}
setInterval(()=>app.querySelectorAll('[data-chrono]').forEach(el=>{el.textContent=duree(Date.now()-Number(el.dataset.chrono))}),1000);

/* ---- Ajouter ---- */
function vAjouter(){
  const a=state.add;
  if(a.res)return vApercu();
  const noAI=!sample;
  return `<h2>Ajouter ce que j'ai fait en classe</h2>
  ${noAI?`<div class="offline">L'aide de Claude n'est pas encore branchée (il manque la clé API dans le fichier .env). Tu peux quand même enregistrer une leçon à la main plus bas.</div>`:''}
  ${!noAI&&imagesOK?`<section class="card stack">
    <h3>1. Prends en photo ce que tu veux ranger</h3>
    <label class="drop" id="drop" for="photo-in">
      <svg width="54" height="54" viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--accent)" d="M9 3 7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>
      <strong>Appuie ici pour prendre une photo ou choisir des images</strong>
      <span class="small muted">Jusqu'à ${maxImages} photos : une leçon, des exercices, une évaluation, ton agenda, un mot de la maîtresse… Je trouve tout seul de quoi il s'agit.</span>
    </label>
    <input type="file" id="photo-in" accept="image/*" multiple hidden>
    ${a.images.length?`<div class="thumbs">${a.images.map((im,i)=>`<div class="stack" style="gap:4px;align-items:center"><img src="${esc(im.thumb||'')}" alt="Photo ${i+1}"><button class="btn ghost small" data-act="rm-img" data-v="${i}">Retirer</button></div>`).join('')}</div>`:''}
    <h3>2. Dis-moi en quelques mots (facultatif)</h3>
    <div class="form-grid"><label class="f">Ce qu'on a fait<input type="text" id="add-indice" value="${esc(a.indice)}" placeholder="ex : les fractions, mon agenda, l'évaluation de dictée…"></label><label class="f">Date<input type="date" id="add-date" value="${esc(a.date)}"></label></div>
    ${a.charge?attente(`Je charge la photo ${a.charge.i} sur ${a.charge.n}…`,{charge:a.charge}):''}
    <div class="row"><button class="btn primary big" data-act="analyser" ${a.images.length&&!a.busy&&!a.charge?'':'disabled'}>Lire mes photos</button></div>
    ${a.busy&&a.images.length?attente('Je lis tes photos…',{debut:a.debut,sous:'Cela peut prendre une ou deux minutes.'}):''}
    ${a.err&&a.errSrc==='photo'?`<p style="color:var(--bad)">${esc(a.err)}</p>`:''}
  </section>`:''}
  ${!noAI?`<section class="card stack"><h3>${imagesOK?'Ou sans photo : écris le sujet':'Écris le sujet de la leçon'}</h3>
    <form class="row" data-form="sujet"><input type="text" id="add-sujet" name="sujet" value="${esc(a.sujet)}" placeholder="ex : le passé composé avec être" style="flex:1;min-width:200px" required><button class="btn" ${a.busy?'disabled':''}>Préparer la leçon</button></form>
    ${a.busy&&!a.images.length?attente('Je prépare ta fiche…',{debut:a.debut,sous:'Cela peut prendre une minute.'}):''}
    ${a.err&&a.errSrc==='sujet'?`<p style="color:var(--bad)">${esc(a.err)}</p>`:''}</section>`:''}
  <section class="card"><details ${noAI?'open':''}><summary>Enregistrer une leçon à la main</summary>
    <form class="stack" data-form="manuel" style="margin-top:10px">
      <div class="form-grid"><label class="f">Titre<input type="text" id="man-titre" name="titre" required></label><label class="f">Matière<select id="man-mat" name="matiere">${matOptions('francais')}</select></label><label class="f">Date<input type="date" id="man-date" name="date" value="${TODAY()}"></label></div>
      <label class="f">Ce que je retiens<textarea id="man-txt" name="txt" placeholder="Une idée par ligne"></textarea></label>
      <div><button class="btn primary">Enregistrer</button></div>
    </form></details></section>`;
}
const lignesExercices=L=>`<div class="stack" style="gap:6px;margin-top:8px">${L.map(x=>`<div class="item small" style="align-items:flex-start"><b style="color:${x.juste===true?'var(--ok)':x.juste===false?'var(--bad)':'var(--ink-soft)'}">${x.juste===true?'✓':x.juste===false?'✗':'·'}</b><div class="grow"><div class="t">${rich(x.enonce)}</div>${x.reponseEleve?`<div>Ma réponse : ${rich(x.reponseEleve)}</div>`:''}${x.juste!==true&&x.bonneReponse?`<div>Bonne réponse : <strong>${rich(x.bonneReponse)}</strong></div>`:''}</div></div>`).join('')}</div>`;
function vApercu(){
  const a=state.add,r=a.res,t=TODAY(),LL=r.lecons,L=r.devoirs,n=r.note;
  if(r.lisible===false)return `<section class="card stack"><h2>Je n'arrive pas à bien lire</h2><p>${rich(r.description||'Les photos sont floues ou trop sombres.')}</p><p>Reprends la photo bien à plat, avec de la lumière, sans ton doigt dessus.</p><div class="row"><button class="btn primary" data-act="reset-add">Recommencer</button></div></section>`;
  const rien=!LL.length&&!L.length&&!n,plus=LL.length>1;
  return `<section class="card stack"><div class="row"><span class="pill">${esc(GENRES[r.genre])}</span>${plus?`<span class="pill">${LL.length} leçons</span>`:''}</div>
    <h2>Voilà ce que j'ai trouvé</h2>
    ${r.description?`<p>${rich(r.description)}</p>`:''}
    ${r.infos.length?`<div class="note-box"><strong>Pour tes parents :</strong><ul>${r.infos.map(x=>`<li>${rich(x)}</li>`).join('')}</ul></div>`:''}
    ${rien?`<p class="muted">Il n'y a rien à ranger dans le cartable sur ${a.images.length>1?'ces photos':'cette photo'} : ni leçon, ni devoir, ni note.</p><div class="row"><button class="btn primary" data-act="reset-add">${r.infos.length?"C'est noté":'Recommencer'}</button></div>`:''}
  </section>
  ${rien?'':`<form class="stack" data-form="save-res">
    ${LL.map((l,j)=>{const ex=l.exercices,nJ=ex.filter(x=>x.juste===true).length;
      return `<section class="card stack"><label class="row" style="font-weight:700"><input type="checkbox" class="chk" name="kl${j}" checked> ${plus?`Ranger la leçon ${j+1} sur ${LL.length}`:r.genre==='lecon'?'Ranger la leçon':'Ranger la leçon de cette notion'} (+5 étoiles)</label>
      <div class="form-grid"><label class="f">Titre<input type="text" name="lTitre${j}" value="${esc(l.titre||'')}" required></label><label class="f">Matière<select name="lMat${j}">${matOptions(l.matiere)}</select></label><label class="f">Date<input type="date" name="lDate${j}" value="${esc(a.date)}"></label></div>
      ${l.resume?`<p><strong>En bref :</strong> ${rich(l.resume)}</p>`:''}

async function prepImage(file){
  try{
    const bmp=await createImageBitmap(file);
    const draw=(max,q)=>new Promise(res=>{const s=Math.min(1,max/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);cv.toBlob(b=>res({b,cv}),'image/jpeg',q)});
    const big=await draw(1800,.86);const small=await draw(320,.6);
    return {blob:big.b||file,thumb:small.cv.toDataURL('image/jpeg',.6)};
  }catch(e){return {blob:file,thumb:null}}
}

function chartNotes(ns){
  const s=ns.slice().sort((a,b)=>a.date<b.date?-1:1);if(s.length<2)return '';
  const W=640,H=220,L=34,R=14,T=12,B=30;const x=i=>L+(W-L-R)*(s.length===1?.5:i/(s.length-1));const y=v=>T+(H-T-B)*(1-v/20);
  const pts=s.map((n,i)=>[x(i),y(20*n.valeur/n.sur)]);
  const grid=[0,5,10,15,20].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v===10?'0':'3 4'}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('');
  const step=Math.ceil(s.length/8);
  const labels=s.map((n,i)=>i%step===0||i===s.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(shortDate(n.date))}</text>`:'').join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution des notes sur 20">${grid}<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?6:4.5}" fill="${M(s[i].matiere).c}" stroke="var(--surface)" stroke-width="2"><title>${esc(s[i].intitule)} : ${fmtN(s[i].valeur)}/${s[i].sur}</title></circle>`).join('')}${labels}</svg></div>`;
}

/* ---- Sa semaine (espace parents) : les 7 derniers jours, comparés aux 7 d'avant ---- */
function bilanSemaine(){
  const t=TODAY(),debut=addDays(t,-6),dAvant=addDays(t,-13),finAvant=addDays(debut,-1);
  const dans=(d,a,b)=>d>=a&&d<=b,ts0=new Date(debut+'T00:00:00').getTime();
  const actifs=joursActifs(),jours=[...Array(7)].map((_,i)=>addDays(debut,i));
  const quiz=all('quiz').filter(q=>q.termine&&!q.valide);
  const qs=quiz.filter(q=>dans(q.date,debut,t)),nbAvant=quiz.filter(q=>dans(q.date,dAvant,finAvant)).length;
  const vrais=qs.filter(q=>!q.defi),defis=qs.filter(q=>q.defi);
  // Refait alors qu'il l'avait déjà réussi (80 % ou plus) dans les 7 jours d'avant : c'est ce que freine la règle ÷2.
  const refaits=vrais.filter(q=>{const k=(q.leconIds||[]).join(',');return quiz.some(x=>x!==q&&!x.defi&&x.createdAt<q.createdAt&&x.createdAt>q.createdAt-7*864e5&&(x.leconIds||[]).join(',')===k&&quizPct(x)>=.8)});
  const moy=a=>a.length?Math.round(100*a.reduce((n,q)=>n+quizPct(q),0)/a.length):null;
  const parMat=MATIERES.map(m=>({m,qs:vrais.filter(q=>q.matiere===m.id)})).filter(o=>o.qs.length).sort((a,b)=>b.qs.length-a.qs.length);
  const b=bilan(),somme=(a,z)=>b.gains.filter(g=>dans(g.date,a,z)).reduce((n,g)=>n+g.pts,0);
  const dv=all('devoirs').filter(d=>d.fait&&d.faitLe&&dans(d.faitLe,debut,t));
  const mis=plansVac().flatMap(p=>p.jours.filter(j=>dans(j.date,debut,t)).map(j=>missionFaite(p,j)));
  const rang={avenir:0,vu:1,fragile:1,progres:2,acquis:3};
  const evol=COMPETENCES.map(c=>({c,a:etatComp(c,ts0).etat,n:etatComp(c).etat})).filter(x=>x.a!==x.n);
  return {jours:jours.map(d=>({d,ok:actifs.has(d)})),serie:serie().n,nbQuiz:vrais.length,nbDefis:defis.length,nbAvant,moy:moy(vrais),
    faciles:vrais.filter(q=>q.niveau==='facile').length,refaits,parMat,moyDe:moy,etoiles:somme(debut,t),etoilesAvant:somme(dAvant,finAvant),
    devoirs:dv.length,aTemps:dv.filter(d=>d.faitLe<=d.pour).length,retard:all('devoirs').filter(d=>!d.fait&&d.pour<t).length,
    missions:mis.length?{faites:mis.filter(Boolean).length,total:mis.length}:null,
    progres:evol.filter(x=>rang[x.n]>rang[x.a]&&rang[x.n]>=2),recul:evol.filter(x=>x.n==='fragile'||rang[x.n]<rang[x.a])};
}

    ${w.parMat.length?`<div class="tablewrap"><table class="t"><tr><th>Matière</th><th>Quiz</th><th>Réussite</th></tr>${w.parMat.map(o=>`<tr><td>${mchip(o.m.id)}</td><td>${o.qs.length}</td><td>${w.moyDe(o.qs)} %</td></tr>`).join('')}</table></div>`:'<p class="small muted">Aucun quiz cette semaine.</p>'}
    ${w.progres.length?`<details id="sem-progres" ${ouvert('sem-progres')}><summary>📈 ${w.progres.length} point${w.progres.length>1?'s':''} du programme en progrès</summary><div class="stack" style="margin-top:8px">${w.progres.slice(0,8).map(ligneComp).join('')}</div></details>`:''}
    ${w.recul.length?`<details id="sem-recul" ${ouvert('sem-recul')}><summary>⚠️ ${w.recul.length} point${w.recul.length>1?'s':''} à surveiller</summary><div class="stack" style="margin-top:8px">${w.recul.slice(0,8).map(ligneComp).join('')}</div></details>`:''}
    <p class="small muted">Chiffres des 7 derniers jours, aujourd'hui compris.</p>
  </section>`;
}

/* ---- Accueil d'un cartable neuf ----
   Le parent crée le code, donne le prénom, choisit les récompenses, puis un écran explique les étoiles à l'enfant.
   config/main.accueil vaut « en-cours » jusqu'au bout : recharger la page reprend l'accueil, code parent d'abord. */
const besoinAccueil=()=>!loading()&&storeMode==='db'&&(cfg().accueil==='en-cours'||!pinDefini()||!(cfg().prenom||'').trim());
function vAccueil(){
  const e=(state.acc||(state.acc={etape:1})).etape;

  let corps;
  if(e===1)corps=pinDefini()
    ?`${tete('Code parent','Un cartable est en cours de préparation. Entrez le code parent pour continuer.')}
      <form class="form-grid" data-form="acc-pin"><label class="f">Code parent<input type="password" name="pin" inputmode="numeric" autocomplete="off" required data-autofocus></label><div><button class="btn primary">Continuer</button></div></form>`
    :`${tete(SK().accueil,'Pour commencer, choisissez un code parent de 4 à 8 chiffres. Il protège l\'espace parents : les récompenses, les demandes à valider et le suivi du programme. Gardez-le pour vous.')}

  else if(e===2){const z=cfg().zone||ZONE_DEFAUT;corps=`${tete(SK().heros,'Le prénom apparaît partout dans le cartable. La zone sert au calendrier des vacances scolaires.')}
      <form class="form-grid" data-form="acc-prenom"><label class="f">Prénom de l'enfant<input type="text" name="prenom" value="${esc(cfg().prenom||'')}" autocomplete="off" required data-autofocus></label><label class="f">Zone de vacances<select name="zone">${['A','B','C'].map(x=>`<option value="${x}" ${x===z?'selected':''}>Zone ${x}</option>`).join('')}</select></label><div><button class="btn primary">Continuer</button></div></form>`}
  else if(e===3){const deja=all('recompenses').sort((a,b)=>a.cout-b.cout),titres=new Set(deja.map(r=>r.titre));
    corps=`${tete('Les récompenses',`${esc(prenom())} gagne des étoiles en travaillant et les échange contre des récompenses, que vous validez. Cochez celles que vous proposez et ajustez leur prix. Vous pourrez tout changer plus tard dans l'espace parents.`)}
      <form class="stack" data-form="acc-rec">
        ${deja.map(r=>`<div class="item"><span class="grow">${esc(r.titre)}</span><span class="cost">${STAR} ${r.cout}</span></div>`).join('')}
        ${SUGGESTIONS.map(([t,c],i)=>titres.has(t)?'':`<label class="item"><input type="checkbox" class="chk" name="s${i}" ${deja.length?'':'checked'}><span class="grow">${esc(t)}</span><input type="number" name="c${i}" value="${c}" min="1" style="width:6em" aria-label="Prix en étoiles : ${esc(t)}"></label>`).join('')}
        <div class="form-grid"><label class="f">Une autre récompense<input type="text" name="t" placeholder="Facultatif"></label><label class="f">Prix en étoiles<input type="number" name="c" min="1" value="50"></label></div>
        <p class="small muted">Repère : un quiz de 10 questions rapporte 13 étoiles avec 8 bonnes réponses, 30 sans faute. Une bonne journée complète rapporte 30 à 50 étoiles.</p>
        <div><button class="btn primary">Continuer</button></div>
      </form>`}
  else{const rec=all('recompenses').sort((a,b)=>a.cout-b.cout);
    corps=`${tete(`${esc(prenom())}, voici tes étoiles ${STAR}`,'Chaque fois que tu travailles, tu gagnes des étoiles.')}
      <ul class="regles">
        <li><b>+1</b><span>par bonne réponse à un quiz</span></li>
        <li><b>+5</b><span>quand tu finis un quiz, un devoir, ta routine du soir ou quand tu ajoutes une leçon</span></li>
        <li><b>×2</b><span>les étoiles d'un quiz réussi sans faute</span></li>
      </ul>
      <p>Il faut ${coutNiveau(0)} étoiles pour monter d'un niveau, puis un peu plus à chaque fois : ${SK().niveaux.slice(0,3).map(esc).join(', ')}… jusqu'au niveau ${SK().niveaux.length}, ${esc(SK().niveaux[SK().niveaux.length-1])} !</p>
      <p>Dans <b>Mon trésor</b>, tu échanges tes étoiles contre une récompense : tu la demandes, et tes parents la valident.${rec.length?' Pour l\'instant :':''}</p>
      ${rec.length?`<div class="stack">${rec.map(r=>`<div class="item"><span class="grow">${esc(r.titre)}</span><span class="cost">${STAR} ${r.cout}</span></div>`).join('')}</div>`:''}
      <div><button class="btn primary" data-act="acc-fin" data-autofocus>C'est parti !</button></div>`}
  return `<section class="card stack accueil">${corps}</section>`;
}

document.addEventListener('submit',async e=>{

    const p=val/sur;gagne(ptsNote({valeur:val,sur,createdAt:Date.now()}),p>=.8?'Superbe note, bravo !':p>=.6?'Belle note !':"Merci de l'avoir rentrée. On va travailler ça ensemble.");f.reset();return}
  // Le code parent est vérifié par le serveur, qui le garde haché : il n'arrive jamais dans la page.
  if(kind==='pin'){const creer=!pinDefini();if(creer&&!/^\d{4,8}$/.test(fd.pin)){toast('Choisissez un code de 4 à 8 chiffres.');return}
    let r;try{r=await fetch('/api/pin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin:fd.pin,creer})}).then(x=>x.json())}catch(e){toast("Le serveur du cartable ne répond pas.");return}
    if(r.ok){if(creer){S.config.set('pin',{id:'pin',defini:true});toast('Code parent créé.')}state.parent=true;render()}else toast(r.code==='deja'?'Un code existe déjà.':'Code incorrect.');return}
  if(kind==='rec'){put('recompenses',uid(),{titre:fd.titre,cout:Math.max(1,Number(fd.cout)||1)});f.reset();return}
  if(kind==='acc-pin'){const creer=!pinDefini();
    if(creer&&!/^\d{4,8}$/.test(fd.pin)){toast('Choisissez un code de 4 à 8 chiffres.');return}
    if(creer&&fd.pin!==fd.pin2){toast('Les deux codes ne sont pas pareils.');return}
    let r;try{r=await fetch('/api/pin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin:fd.pin,creer})}).then(x=>x.json())}catch(e){toast("Le serveur du cartable ne répond pas.");return}
    if(!r.ok){toast('Code incorrect.');return}
    if(creer){S.config.set('pin',{id:'pin',defini:true});put('config','main',{...cfg(),accueil:'en-cours'})}
    state.parent=true;state.acc={etape:(cfg().prenom||'').trim()&&!creer?3:2};render();return}
  if(kind==='acc-prenom'){const p=(fd.prenom||'').trim();if(!p)return;put('config','main',{...cfg(),prenom:p,zone:fd.zone||ZONE_DEFAUT,accueil:'en-cours'});state.acc={etape:3};render();return}
  if(kind==='acc-rec'){
    SUGGESTIONS.forEach(([t,c],i)=>{if(fd['s'+i])put('recompenses',uid(),{titre:t,cout:Math.max(1,Number(fd['c'+i])||c)})});
    const t=(fd.t||'').trim();if(t)put('recompenses',uid(),{titre:t,cout:Math.max(1,Number(fd.c)||1)});
    state.acc={etape:4};render();return}
  if(kind==='prenom'){put('config','main',{...cfg(),prenom:(fd.prenom||'').trim()});toast('Enregistré.');return}
});
const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))state.view=h;
render();initStore();
</script>
